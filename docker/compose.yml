# The reveille infrastructure, DECLARED (operator request, 2026-07-30, after a
# day in which two outages and one near-miss were all infra assembled by hand):
#   - a broker redeploy recreated the container without the shared network, so
#     the whole fleet lost the bus BY NAME while the host-side probe stayed green
#   - a stray SIGTERM left the broker half-dead with nothing to bring it back
#   - a smoke test dual-homed the LIVE broker because teardown was hand-rolled
# Everything the platform needs to exist before any agent runs lives here: the
# network, the broker, the proxy. Idempotent, ordered, supervised -- `make up`.
#
# NOT here, deliberately:
#   - the LAUNCHER: it stays a host process (pinned clone + Stop hook
#     supervision). Containerising it requires handing a container the docker
#     socket, a security decision the architect has explicitly left open; this
#     file must not pre-empt it.
#   - AGENT containers: the launcher creates those on demand, per user. They
#     join the network declared here -- which is the exact membership a hand
#     deploy silently destroyed.
#
# The guards (refuse-not-create for SERVER_DATA, refuse-to-rebuild an existing
# tag) live in `make up` / `make server-image`, not here: compose cannot express
# a refusal, and a guard that only fires on one path is a guard someone routes
# around. The Makefile is the one deploy path.

name: reveille

networks:
  reveille:
    # A FIXED name, not the project-scoped default: agent containers are created
    # by the launcher (DEFAULT_NETWORK="reveille") and must land on this same
    # network, or container DNS cannot resolve the broker for them.
    #
    # EXTERNAL, because the network is shared infrastructure, not this stack's
    # private plumbing: the launcher's _ensure_network creates it when an agent
    # is provisioned first, and every live deployment already carries one made
    # by hand -- which compose REFUSES to adopt (missing compose labels), so a
    # non-external declaration failed the first real cutover on sight. External
    # also states the down-keeps-the-network property in the file itself:
    # compose never removes what it does not own. `make up` creates it
    # idempotently before compose runs, so a fresh host needs no extra step.
    name: ${REVEILLE_NET:-reveille}
    external: true

services:
  broker:
    image: ${SERVER_IMAGE:-reveille-server:dev}
    # No build: -- `make up` builds via server-image, which refuses to rebuild
    # an existing tag. Compose building on its own would silently produce two
    # different images answering to one name, the exact ambiguity the refusal
    # exists to prevent.
    # The name agents DIAL is the network ALIAS below, which is per-network --
    # so a scratch stack (the gate) can carry the same alias on its own network
    # while the container NAME stays unique per host.
    container_name: ${BROKER_NAME:-reveille-server}
    restart: unless-stopped
    networks:
      reveille:
        aliases: [reveille-server]
    ports:
      - "${REVEILLE_PORT:-8765}:8765"
    volumes:
      - ${SERVER_DATA:?set SERVER_DATA explicitly -- an inherited HOME here once nearly deployed an EMPTY database}:/data
    environment:
      REVEILLE_AGENTS_PATH: ${AGENTS_PATH:-/agents}
      # THE UPSTREAM SETTINGS ARE NOT LISTED HERE, AND THAT IS THE FIX (live
      # outage 2026-08-18). Measured on this deployment's own docker compose:
      # an `environment` entry BEATS `env_file` -- both `KEY: ${VAR:-}` and a
      # bare `KEY:` put an EMPTY value on the container when the shell has none,
      # so either spelling silently overrode the operator's reveille.env. The
      # day a deploy ran from a shell that did not carry them, voices, the ear
      # and the script writer went off at once and the only tell was a missing
      # line in /version. A setting that lives in a shell's memory is not a
      # setting. So DES-009 (voices), DES-013 (the script writer), DES-014 (the
      # ear), their models/tokens/timeouts, the LAN-plaintext flag of ruling
      # 11036 and the upload cap all come from the env_file below and from
      # nowhere else -- one home, read on every recreate. Unset there still
      # means the feature is off, exactly as before.
      # DES-018: the public origin -- builds the exact redirect URI the
      # providers were registered with, and turns the session cookie into
      # __Host- + Secure when it is https. Derived from PROXY_SITE by make.
      REVEILLE_PUBLIC_URL: ${REVEILLE_PUBLIC_URL:-}
    # DES-018 s4: the provider credentials live in ONE file beside the data,
    # never in this file, the Makefile, git or the bus:
    #   $SERVER_DATA/reveille.env   (mode 600)
    #     REVEILLE_OIDC_GOOGLE_ID=... / _SECRET, _GITHUB_, _MICROSOFT_
    #     REVEILLE_SIGNUP=open|closed|mythos.org,other.org   (optional)
    #     REVEILLE_UPLOAD_MAX_MB=200                          (optional)
    # and, since 0.2.167, this deployment's SETTINGS as well -- they are not
    # secrets, they are here because this file is the one thing every recreate
    # reads:
    #     REVEILLE_TTS_URL=      (voices; unset = no voice worker)
    #     REVEILLE_STT_URL=      REVEILLE_STT_MODEL=      (the ear)
    #     REVEILLE_SCRIPT_URL=   REVEILLE_SCRIPT_MODEL=   (the script writer)
    #     REVEILLE_LAN_PLAINTEXT=1   (permits a plaintext LAN upstream, 11036)
    #     REVEILLE_TTS_TOKEN=  REVEILLE_STT_TOKEN=  REVEILLE_SCRIPT_TOKEN=
    #       (only if an upstream wants one -- these ARE secrets)
    #     REVEILLE_STT_TIMEOUT=  REVEILLE_SCRIPT_TIMEOUT=  (seconds, optional)
    # To change one for a single run, edit the line and `make up`; there is no
    # shell that can quietly outrank this file any more.
    # Absent file = no doors; a provider without an ID is simply not a door.
    env_file:
      - path: ${SERVER_DATA}/reveille.env
        required: false
    # The daemon bounds its own graceful shutdown at 5s (0.2.26); 12 gives it
    # room plus the courtesy-frame delay before docker escalates to SIGKILL.
    # Before 0.2.26 a SIGTERM could wedge the process half-dead forever, and
    # docker's Up was a lie -- the healthcheck below is what makes that state
    # VISIBLE (unhealthy) instead of silently trusted.
    stop_grace_period: 12s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c",
             "import urllib.request as u; assert u.urlopen('http://127.0.0.1:8765/health', timeout=3).read() == b'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: ${PROXY_IMAGE:-caddy:2-alpine}
    container_name: ${PROXY_NAME:-reveille-proxy}
    restart: unless-stopped
    # host networking, NOT the reveille network: the launcher binds 127.0.0.1
    # and must stay unreachable from the LAN and from the docker network; the
    # proxy reaches it over loopback and publishes one front door for everyone
    # else. This is DES-006 U3's shape, unchanged.
    network_mode: host
    environment:
      PROXY_SITE: ${PROXY_SITE:-:80}
      BROKER_UPSTREAM: 127.0.0.1:${REVEILLE_PORT:-8765}
      LAUNCHER_UPSTREAM: 127.0.0.1:${LAUNCHER_PORT:-8766}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state. A hostname PROXY_SITE makes Caddy
      # issue and renew Let's Encrypt certs; without this volume every container
      # recreate discards them and re-issues -- straight into LE's rate limits.
      - caddy-data:/data
    depends_on:
      broker:
        condition: service_healthy

volumes:
  # ACME certificates and account keys (see the proxy's /data mount).
  caddy-data:
