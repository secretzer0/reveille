# The reveille infrastructure, DECLARED (operator request, 2026-07-30, after a
# day in which two outages and one near-miss were all infra assembled by hand):
#   - a broker redeploy recreated the container without the shared network, so
#     the whole fleet lost the bus BY NAME while the host-side probe stayed green
#   - a stray SIGTERM left the broker half-dead with nothing to bring it back
#   - a smoke test dual-homed the LIVE broker because teardown was hand-rolled
# Everything the platform needs to exist before any agent runs lives here: the
# network, the broker, the proxy. Idempotent, ordered, supervised -- `make up`.
#
# NOT here, deliberately:
#   - the LAUNCHER: it stays a host process (pinned clone + Stop hook
#     supervision). Containerising it requires handing a container the docker
#     socket, a security decision the architect has explicitly left open; this
#     file must not pre-empt it.
#   - AGENT containers: the launcher creates those on demand, per user. They
#     join the network declared here -- which is the exact membership a hand
#     deploy silently destroyed.
#
# The guards (refuse-not-create for SERVER_DATA, refuse-to-rebuild an existing
# tag) live in `make up` / `make server-image`, not here: compose cannot express
# a refusal, and a guard that only fires on one path is a guard someone routes
# around. The Makefile is the one deploy path.

name: reveille

networks:
  reveille:
    # A FIXED name, not the project-scoped default: agent containers are created
    # by the launcher (DEFAULT_NETWORK="reveille") and must land on this same
    # network, or container DNS cannot resolve the broker for them.
    #
    # EXTERNAL, because the network is shared infrastructure, not this stack's
    # private plumbing: the launcher's _ensure_network creates it when an agent
    # is provisioned first, and every live deployment already carries one made
    # by hand -- which compose REFUSES to adopt (missing compose labels), so a
    # non-external declaration failed the first real cutover on sight. External
    # also states the down-keeps-the-network property in the file itself:
    # compose never removes what it does not own. `make up` creates it
    # idempotently before compose runs, so a fresh host needs no extra step.
    name: ${REVEILLE_NET:-reveille}
    external: true

services:
  broker:
    image: ${SERVER_IMAGE:-reveille-server:dev}
    # No build: -- `make up` builds via server-image, which refuses to rebuild
    # an existing tag. Compose building on its own would silently produce two
    # different images answering to one name, the exact ambiguity the refusal
    # exists to prevent.
    # The name agents DIAL is the network ALIAS below, which is per-network --
    # so a scratch stack (the gate) can carry the same alias on its own network
    # while the container NAME stays unique per host.
    container_name: ${BROKER_NAME:-reveille-server}
    restart: unless-stopped
    networks:
      reveille:
        aliases: [reveille-server]
    ports:
      - "${REVEILLE_PORT:-8765}:8765"
    volumes:
      - ${SERVER_DATA:?set SERVER_DATA explicitly -- an inherited HOME here once nearly deployed an EMPTY database}:/data
    environment:
      REVEILLE_AGENTS_PATH: ${AGENTS_PATH:-/agents}
      # DES-009: the voice worker's address, BY NAME on this network. Unset by
      # default, and unset means no voice worker at all -- so a deploy that has
      # not built the model image behaves exactly as it did before voices existed.
      REVEILLE_TTS_URL: ${REVEILLE_TTS_URL:-}
      REVEILLE_TTS_TOKEN: ${REVEILLE_TTS_TOKEN:-}
      # DES-013: the script writer's address, the same shape (unset = no writer),
      # and the one flag that lets EITHER upstream be a plaintext host on the
      # operator's own LAN (ruling 11036) -- the daemon refuses without it and
      # names it; the deploy passes it through or the refusal stands.
      REVEILLE_SCRIPT_URL: ${REVEILLE_SCRIPT_URL:-}
      REVEILLE_SCRIPT_MODEL: ${REVEILLE_SCRIPT_MODEL:-}
      REVEILLE_SCRIPT_TIMEOUT: ${REVEILLE_SCRIPT_TIMEOUT:-}
      REVEILLE_SCRIPT_TOKEN: ${REVEILLE_SCRIPT_TOKEN:-}
      REVEILLE_LAN_PLAINTEXT: ${REVEILLE_LAN_PLAINTEXT:-}
      # DES-014: the ear (speech to text), the third upstream, same shape.
      REVEILLE_STT_URL: ${REVEILLE_STT_URL:-}
      REVEILLE_STT_TOKEN: ${REVEILLE_STT_TOKEN:-}
      REVEILLE_STT_MODEL: ${REVEILLE_STT_MODEL:-}
      REVEILLE_STT_TIMEOUT: ${REVEILLE_STT_TIMEOUT:-}
      # DES-018: the public origin -- builds the exact redirect URI the
      # providers were registered with, and turns the session cookie into
      # __Host- + Secure when it is https. Derived from PROXY_SITE by make.
      REVEILLE_PUBLIC_URL: ${REVEILLE_PUBLIC_URL:-}
    # DES-018 s4: the provider credentials live in ONE file beside the data,
    # never in this file, the Makefile, git or the bus:
    #   $SERVER_DATA/reveille.env   (mode 600)
    #     REVEILLE_OIDC_GOOGLE_ID=... / _SECRET, _GITHUB_, _MICROSOFT_
    #     REVEILLE_SIGNUP=open|closed|mythos.org,other.org   (optional)
    # Absent file = no doors; a provider without an ID is simply not a door.
    env_file:
      - path: ${SERVER_DATA}/reveille.env
        required: false
    # The daemon bounds its own graceful shutdown at 5s (0.2.26); 12 gives it
    # room plus the courtesy-frame delay before docker escalates to SIGKILL.
    # Before 0.2.26 a SIGTERM could wedge the process half-dead forever, and
    # docker's Up was a lie -- the healthcheck below is what makes that state
    # VISIBLE (unhealthy) instead of silently trusted.
    stop_grace_period: 12s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c",
             "import urllib.request as u; assert u.urlopen('http://127.0.0.1:8765/health', timeout=3).read() == b'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3

  # DES-009 commit 1. The synthesizer, reachable BY NAME from the broker and from
  # nowhere else: NO ports: key, deliberately and permanently. Its audience is one
  # process, which is what makes "as private as possible" and "hostable off this
  # network later" the same design rather than a trade-off (DES-009 section 3) --
  # moving it elsewhere changes REVEILLE_TTS_URL and nothing else.
  #
  # OPTIONAL BY CONSTRUCTION: `make up` starts the platform without it unless the
  # voices profile is asked for. A fleet that has not built the model image must
  # not have its deploy blocked by a service nobody has configured, and a broker
  # whose REVEILLE_TTS_URL is unset simply runs no voice worker.
  tts:
    profiles: [voices]
    # devnen/Chatterbox-TTS-Server built from THEIR Dockerfile.cu128 at the SHA
    # docker/tts.upstream pins (DES-009 section 4.1): we own zero torch. Its
    # port is 8004 and the broker's REVEILLE_TTS_URL is http://reveille-tts:8004.
    image: ${TTS_IMAGE:-reveille-tts:dev}
    container_name: ${TTS_NAME:-reveille-tts}
    restart: unless-stopped
    networks:
      reveille:
        aliases: [reveille-tts]
    environment:
      # Upstream PR #161 (on our fork) batches a request's chunks through the
      # turbo decoder; fork fc464a8 made the decode pad-aware (mask + per-row
      # position ids), so rows in a mixed-length batch stop where their text
      # stops: measured short rows 1.3-1.4 s batched vs 0.9-1.4 s sequential
      # (they ran 4-6 s before the fix), four rows in 5.6 s wall vs 14.8 s
      # sequential. 4 is what an 8 GB card holds with real chunks (7.7 GB peak;
      # 8 OOMs); the VM's 12 GB 3060 can take 8 once it is measured there.
      TTS_BATCH_SIZE: "4"
    volumes:
      # THE SYNTHESIZER'S REFERENCE DIR IS ITS OWN (DES-013 section 3 as amended,
      # ruling 11104): bank clips arrive by PUSH over its /upload_reference as
      # bank-<id>-<updated_ns>.wav -- the same path whether it runs beside the
      # broker or on another machine, so there is NO bind mount from the
      # broker's voices dir here. The broker's <SERVER_DATA>/voices stays the
      # source of truth; the worker reconciles at start and on any clip the
      # listing lacks. A hand-dropped <name>.wav in this volume is a per-host
      # convenience (their semantics), and their predefined set (28 shipped in
      # the image, /app/voices) still answers when nothing is assigned.
      - tts-reference:/app/reference_audio
      # The model is about a gigabyte and downloads into HF_HOME. Without this,
      # removing the container re-downloads it -- a ten-minute first start every
      # time, which the operator would meet on their SECOND deploy rather than
      # their first.
      - tts-cache:/app/hf_cache
    # THE GPU, RESERVED EXPLICITLY. Without this the container has no /dev/nvidia*,
    # torch.cuda.is_available() is False, and the service synthesizes on the CPU
    # while looking perfectly healthy -- three GPUs idle and the only symptom is
    # "it feels slow" (architect, msg 8941). The service also SAYS which device it
    # took (/api/model-info, logged by the broker at worker start), because a
    # reservation that silently fails to apply is the same defect one layer up.
    # Behind the voices profile, so a host with no nvidia runtime is unaffected:
    # that is what the profile buys.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import json,urllib.request as u; assert json.load(u.urlopen('http://127.0.0.1:8004/api/model-info', timeout=3))['loaded']"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The model loads at start and downloads on a fresh cache volume: minutes,
      # not seconds, and unhealthy-during-download would restart it mid-download.
      start_period: 15m

  proxy:
    image: ${PROXY_IMAGE:-caddy:2-alpine}
    container_name: ${PROXY_NAME:-reveille-proxy}
    restart: unless-stopped
    # host networking, NOT the reveille network: the launcher binds 127.0.0.1
    # and must stay unreachable from the LAN and from the docker network; the
    # proxy reaches it over loopback and publishes one front door for everyone
    # else. This is DES-006 U3's shape, unchanged.
    network_mode: host
    environment:
      PROXY_SITE: ${PROXY_SITE:-:80}
      BROKER_UPSTREAM: 127.0.0.1:${REVEILLE_PORT:-8765}
      LAUNCHER_UPSTREAM: 127.0.0.1:${LAUNCHER_PORT:-8766}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state. A hostname PROXY_SITE makes Caddy
      # issue and renew Let's Encrypt certs; without this volume every container
      # recreate discards them and re-issues -- straight into LE's rate limits.
      - caddy-data:/data
    depends_on:
      broker:
        condition: service_healthy

volumes:
  # DES-009. The model cache: a downloaded artifact, so losing it costs ten
  # minutes and nothing else -- which is exactly the thing a named volume is for.
  tts-cache:
  # DES-013: the synthesizer's reference clips. Reconstructible from the
  # broker's <SERVER_DATA>/voices by the reconcile, so losing it costs one
  # push per bank voice on the next worker start.
  tts-reference:
  # ACME certificates and account keys (see the proxy's /data mount).
  caddy-data:
