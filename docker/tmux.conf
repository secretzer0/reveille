# Reveille agent tmux: one session ("agent"), many clients (DES-002 4.1).
# Sizing follows the LARGEST client, so a small phone tab cannot shrink the
# operator's view; aggressive-resize re-fits per-window as clients come and go.
set -g window-size largest
setw -g aggressive-resize on

# THE WHEEL SCROLLS WHAT YOU ARE LOOKING AT.
#
# With mouse off, xterm.js translates the wheel into ARROW KEYS for a full-screen
# app -- and arrow-up in the agent's TUI walks prompt history, so scrolling up
# rewrote the composer instead of moving the view. That is not a preference, it
# is the wheel doing something destructive to a text box.
#
# mouse on makes tmux forward wheel events to an app that asked for them, and
# fall back to its own scrollback for one that did not. Either way the gesture
# moves the VIEW.
#
# Costs, both accepted: selecting text with the mouse now enters tmux copy-mode
# rather than the browser's own selection (shift-drag is the escape hatch), and
# a click moves the cursor in panes that support it.
set -g mouse on

# No shell history file inside the pane (DES-002 4.4): a viewer sees everything
# the pane shows, so nothing typed here may persist to disk for later exfil.
set-environment -g HISTFILE /dev/null

# The pane survives client churn; the session dying means the agent process
# ended, which is the container's own exit condition.
set -g detach-on-destroy on
