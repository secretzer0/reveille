<!doctype html><html><head><meta charset="utf-8"><title>Reveille bus</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 :root{
  color-scheme:dark;
  --bg:#0e1116;--rail:#0a0d12;--card:#151a21;--line:#242c37;--hover:#1a212b;
  --fg:#dce3ec;--dim:#8b95a3;--faint:#5a6472;--gold:#e2a63d;--green:#3ecf6a;
  /* Referenced by .pRow button and .chip below but never defined -- both
     rendered with a transparent background (var() with no fallback resolves
     to the property's initial value), which is why chips/buttons across
     Rooms/Tokens/Agents read as visually inconsistent with the rest of the
     dark theme instead of like a raised surface. */
  --chip:#1b212a;
 }
 *{box-sizing:border-box;margin:0}
 html,body{height:100%}
 body{background:var(--bg);color:var(--fg);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:232px 1fr}

 /* ---- sidebar ---- */
 #rail{background:var(--rail);border-right:1px solid var(--line);display:flex;
  flex-direction:column;min-height:0}
 #brand{padding:1rem 1rem .8rem;border-bottom:1px solid var(--line)}
 #brand h1{font-size:1rem;letter-spacing:.22em;color:var(--gold);font-weight:800}
 #brand small{color:var(--faint);display:flex;align-items:center;gap:.4em;margin-top:.2rem}
 #status{width:.55em;height:.55em;border-radius:50%;background:var(--faint)}
 #status.on{background:var(--green)}
 #rail h2{font-size:.68rem;letter-spacing:.14em;color:var(--faint);padding:.9rem 1rem .4rem}
 /* The Agents control is a <button> (it runs script, an <a> would need a
    fake href) but shared the ANCHOR-only selector below, so it rendered with
    zero intentional style -- plain browser button chrome next to the rest of
    the dark, rounded rail. That mismatch is what the operator's screenshot
    was pointing at, more than any single color choice. */
 a.navlink,button.navlink{display:block;margin:.55rem 1rem 0;
  padding:.4rem .6rem;border:1px solid var(--line);border-radius:7px;
  color:var(--fg);text-decoration:none;font:inherit;font-size:.85rem;
  text-align:left;background:none;cursor:pointer;box-sizing:border-box}
 /* --accent, same as --chip below, was never defined in :root -- every other
    hover/focus highlight in this file uses --gold, so this was a stray name
    rather than a deliberate second accent color. */
 a.navlink:hover,button.navlink:hover{border-color:var(--gold)}
 button.navlink[aria-pressed="true"]{background:var(--hover);
  border-color:var(--gold);color:var(--gold)}
 #fmode{display:flex;margin:0 1rem .45rem;border:1px solid var(--line);border-radius:7px;
  overflow:hidden}
 /* [hidden] is a UA rule at the LOWEST specificity, so the display above beat
    it and the attribute did nothing: railMode() hid this control in manage
    mode and it stayed on screen anyway, offering a chat filter over a rail
    that was no longer a chat filter (operator screenshot, msg 8751). Any
    element that sets display AND toggles hidden needs its own [hidden] rule --
    this is that rule, not a workaround for one. */
 #fmode[hidden]{display:none}
 #fmode button{flex:1;background:none;border:0;color:var(--faint);font:inherit;
  font-size:.72rem;letter-spacing:.08em;padding:.28rem 0;cursor:pointer}
 #fmode button.on{background:var(--hover);color:var(--gold)}
 #agents{overflow-y:auto;flex:1;padding:0 .5rem .8rem}
 /* U8 roster: same box as #agents so switching modes does not move the rail
    around underneath the pointer. Shares .agent for the entries, so a roster
    row and a chat row read as the same KIND of thing in the same place. */
 #roster{overflow-y:auto;overflow-x:hidden;flex:1;padding:0 .5rem .8rem}
 #roster .agent.sel{background:var(--hover)}
 /* The roster's status is a WORD. `.agent .st` is the presence DOT -- a 7px
    circle with a border -- so sharing .agent rendered every roster state
    INSIDE that circle: text over the name, and a rail wide enough to scroll
    sideways (operator screenshot, msg 8751). Reset every geometry property the
    dot rule sets, not the ones that happened to show: half a reset is the same
    defect one property along. */
 #roster .st{width:auto;height:auto;border:0;border-radius:0;background:none;
  margin-left:auto;font-size:.66rem;color:var(--faint);white-space:nowrap;flex:none}
 #roster .st.err{color:var(--bad,#e06c6c)}
 /* Rooms are a TREE, not a flat list (operator, msg 8751): an agent can hold
    several rooms and appears under each, because "which rooms does it reach"
    is the question this rail exists to answer. Native <details>/<summary> --
    Tab reaches the summary, Enter/Space toggles it, and a screen reader
    announces expanded/collapsed on its own. No ARIA of ours to keep true. */
 #roster .rgrp{margin:0 0 .3rem}
 #roster .rgrp>summary{display:flex;align-items:center;gap:.4rem;cursor:pointer;
  padding:.28rem .35rem;border-radius:6px;font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);list-style:none}
 #roster .rgrp>summary::-webkit-details-marker{display:none}
 #roster .rgrp>summary::before{content:'\25B8';font-size:.72rem;line-height:1;
  transition:transform .12s ease}
 @media (prefers-reduced-motion:reduce){#roster .rgrp>summary::before{transition:none}}
 #roster .rgrp[open]>summary::before{transform:rotate(90deg)}
 #roster .rgrp>summary:hover{background:var(--hover);color:var(--dim)}
 #roster .rgrp>summary:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
 /* EDGES YOU CAN SEE (operator, msg 8769: "unable to see borders"). The rail
    was drawn as pure whitespace grouping -- calm at four agents, unreadable at
    twenty-three, where nothing said which rows belonged to which heading. A
    rule under the heading and a spine down the open group draw the containment
    the indent only implied. Both at --line, so this reads as structure and
    never competes with the one accent colour. */
 #roster .rgrp>summary{border-bottom:1px solid var(--line)}
 #roster .rgrp[open]{border-left:1px solid var(--line);border-radius:0 0 0 6px;
  margin-left:.15rem}
 #roster .rgrp[open]>summary{border-left:1px solid var(--line);margin-left:-1px;
  padding-left:.45rem}
 #roster .rgrp>summary .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
 #roster .rgrp .agent{margin-left:.5rem}
 /* Sticky headers: scrolling a long room must never leave you unsure which
    room you are in. The rail's own background, so rows pass behind it. */
 #roster .rgrp>summary{position:sticky;top:0;background:var(--rail);z-index:1}
 /* A roster row is a BUTTON, not a clickable div: Tab reaches every agent and
    Enter opens it, which is the whole keyboard path for this rail. */
 #roster button.agent{width:100%;background:none;border:0;font:inherit;
  text-align:left;color:var(--dim)}
 #roster button.agent:focus-visible{outline:2px solid var(--gold);
  outline-offset:-2px}
 #roster .agent .nm{min-width:0}
 /* A row's own edge appears when you are on it, so the pointer always has a
    target with a boundary; a permanent line per row would be twenty-three
    lines of noise. */
 #roster button.agent{border:1px solid transparent}
 #roster button.agent:hover{border-color:var(--line)}
 /* SELECTED = the agent whose tab is in front. A 1px outline lost that at a
    glance in a rail this dense, so it is a filled left bar plus a tint: the
    bar is a shape, which survives being small, being dim, and being read by
    someone who cannot pick gold out of grey. */
 #roster .agent.sel{background:rgba(226,166,61,.10);border-color:transparent;
  box-shadow:inset 3px 0 0 var(--gold)}
 #roster .agent.sel .nm{color:var(--gold);font-weight:600}
 /* Fill AND ring, never colour alone (see the row comment in the script). */
 #roster .dot{width:8px;height:8px;border-radius:50%;flex:none;background:none;
  border:1.5px solid var(--faint)}
 #roster .agent.run .dot{background:var(--green);border-color:var(--green);
  box-shadow:0 0 0 2px rgba(62,207,106,.2)}
 #roster .agent.bad .dot{border-color:#e8555a;box-shadow:0 0 0 2px rgba(232,85,90,.25)}
 #roster .agent.gone .dot{opacity:.35}
 #roster .agent.gone .nm{color:var(--faint)}
 #roster .fold{display:block;width:100%;margin:.15rem 0 .1rem .5rem;background:none;
  border:0;color:var(--faint);font:inherit;font-size:.66rem;text-align:left;
  padding:.2rem .55rem;border-radius:6px;cursor:pointer}
 #roster .fold:hover{background:var(--hover);color:var(--dim)}
 #roster .fold:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
 #rostFilter{margin:0 1rem .45rem;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;color:var(--fg);padding:.3rem .55rem;font:inherit;font-size:.78rem}
 #rostFilter:focus{outline:none;border-color:var(--gold)}
 #rostFilter[hidden]{display:none}
 /* The create item is an ACTION, not an agent, so it must not look like a
    roster row that happens to be named "new agent" -- dashed, gold, and
    separated by a rule above it. */
 #roster .newAgent{margin-top:.5rem;border-top:1px solid var(--line);
   padding-top:.5rem}
 #roster .newAgent button{width:100%;background:none;border:1px dashed var(--line);
   color:var(--gold);font:inherit;padding:.45rem;border-radius:7px;cursor:pointer}
 #roster .newAgent button:hover{background:var(--hover)}
 /* U8 tab strip + frames. U9: the tab is where an agent's ACTIONS live, so the
    well below it is the terminal and nothing else (operator, msg 8751). */
 #agTabs{display:flex;gap:.25rem;flex-wrap:wrap;margin:.5rem 0 0;flex:none}
 #agTabs .tab{display:flex;align-items:center;gap:.4rem;padding:.35rem .6rem;
   border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;
   background:none;color:var(--faint);font:inherit;cursor:pointer}
 #agTabs .tab.on{background:var(--hover);color:var(--gold)}
 #agTabs .tab.err{color:var(--bad,#e06c6c)}
 /* Every action is a real <button> with its own label, never a clickable span:
    the icon carries the meaning for the eye, the aria-label carries it for a
    screen reader, and Tab reaches all of them in the order they are read.
    THE TAB ITSELF IS ALSO A BUTTON, and was not until now: it was a span with
    a click handler, so a keyboard could reach stop, edit, destroy and close on
    a tab it could not select. The destructive controls were reachable and the
    harmless one was not. .tlab is styled to read as the tab's own text rather
    than as an action, because it IS the tab. */
 #agTabs .tab .tlab{display:flex;align-items:center;gap:.4rem;padding:0;
   opacity:1;color:inherit;border-radius:0}
 #agTabs .tab .tlab:hover{background:none}
 #agTabs .tab .acts{display:flex;align-items:center;gap:.05rem;margin-left:.15rem}
 #agTabs .tab button{background:none;border:0;color:inherit;font:inherit;
   line-height:1;cursor:pointer;padding:.1rem .25rem;border-radius:5px;opacity:.65}
 #agTabs .tab button:hover{opacity:1;background:var(--line)}
 #agTabs .tab button:focus-visible{opacity:1;outline:2px solid var(--gold);
   outline-offset:1px}
 #agTabs .tab button.danger:hover{color:#e8555a}
 #agNote{flex:none;margin:.45rem 0 0;background:rgba(232,85,90,.07);
   border-left:2px solid #e8555a;border-radius:0 6px 6px 0;padding:.15rem .6rem}
 #agNote .pAsk{padding-left:0}
 #agFrames{border:1px solid var(--line);border-radius:0 7px 7px 7px;
   flex:1;min-height:14rem;position:relative}
 /* Inactive frames are HIDDEN, never removed -- see the markup comment. */
 #agFrames .fr{position:absolute;inset:0;width:100%;height:100%;border:0}
 #agFrames .fr[hidden]{display:none}
 #agFrames .frErr,#agFrames .frState{position:absolute;inset:0;padding:1rem;
   overflow:auto}
 #agFrames .frState[hidden],#agFrames .frErr[hidden]{display:none}
 #agEmpty{color:var(--faint);font-size:.82rem;padding:1.2rem .2rem}
 /* One modal shell for every per-agent act. It is the SAME markup the pane
    used inline -- edit form, retire/erase confirm, create -- moved behind a
    focus-managed dialog rather than rewritten, so the copy those gates hold
    still ships byte-for-byte. */
 #agDlg{position:fixed;inset:0;background:rgba(6,8,11,.82);backdrop-filter:blur(4px);
   display:none;align-items:center;justify-content:center;z-index:22}
 #agDlg.on{display:flex}
 #agDlgCard{background:var(--card);border:1px solid var(--line);border-radius:14px;
   padding:.9rem 1.2rem 1.1rem;width:min(44rem,92vw);max-height:86vh;overflow-y:auto;
   box-shadow:0 12px 48px rgba(0,0,0,.5);text-align:left}
 #agDlgCard .pRow:first-child b{font-size:.9rem}
 /* Live updates are down, so this rail is a LAST-KNOWN reading. A presence list
    that stopped updating looks exactly like a room where nobody moved -- the
    phantom-watcher class in the UI layer, so say which one it is. */
 #agents.stale{opacity:.55}
 /* The working indicator. Four bars, staggered delays, one keyframe -- no JS loop,
    no timer, nothing to leak. It runs ONLY while the row is `active`, which is the
    only state the bus actually observed. */
 .agent .eq{display:inline-flex;align-items:flex-end;gap:1px;height:9px;flex:none}
 .agent .eq i{width:2px;height:100%;background:var(--grn,#5cd6a0);border-radius:1px;
  transform-origin:bottom;animation:eqbounce .9s ease-in-out infinite}
 .agent .eq i:nth-child(2){animation-delay:.15s;animation-duration:1.1s}
 .agent .eq i:nth-child(3){animation-delay:.35s;animation-duration:.75s}
 .agent .eq i:nth-child(4){animation-delay:.5s;animation-duration:1.25s}
 @keyframes eqbounce{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
 /* Rung and unanswered: PRESENT and still. Motion here would be the inference we
    refuse to make. Faded once "no answer yet" stops being an honest description. */
 .agent.act-waiting .nm{color:var(--gold)}
 .agent.act-unsure .nm{color:var(--gold);opacity:.6}
 @media (prefers-reduced-motion:reduce){.agent .eq i{animation:none;transform:scaleY(.6)}}
 #agents.stale::before{content:'last known -- live updates down';display:block;
  font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);
  padding:.2rem .4rem .35rem}
 .agent{display:flex;align-items:center;gap:.55rem;padding:.34rem .55rem;border-radius:7px;
  cursor:pointer;color:var(--dim);font-size:.86rem}
 .agent:hover{background:var(--hover)}
 .agent.sel{background:var(--hover);outline:1px solid var(--line)}
 .agent .swatch{width:9px;height:9px;border-radius:3px;flex:none}
 .agent .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .agent.live .nm{color:var(--fg)}
 /* Three states, read at a glance without a legend: hollow ring = stale, filled gold =
    live but not reachable in real time, filled green + halo = reachable now.
    Deliberately NOT pulsing. Green means "fine, nothing needed"; motion means "look at
    me" -- and a rail of six agents all breathing is ambient anxiety that trains the eye
    to ignore the very dot it is meant to draw. The halo makes green read as LIT while
    staying still, and the one thing here that does pulse (an armed BLAST) keeps meaning
    what motion should mean. */
 .agent .st{width:7px;height:7px;border-radius:50%;flex:none;background:transparent;
  border:1px solid var(--faint)}
 .agent.live .st{border-color:var(--gold);background:var(--gold)}
 .agent.conn .st{border-color:var(--green);background:var(--green);
  box-shadow:0 0 0 2px rgba(62,207,106,.2)}
 .agent.allrow{border-bottom:1px solid var(--line);border-radius:7px 7px 0 0;
  margin-bottom:.3rem;padding-bottom:.45rem}
 .agent.allrow .nm{color:var(--fg)}
 .agent.deaf .swatch{box-shadow:0 0 0 2px var(--warn,#e0a44c);border-radius:50%}
 .agent.deaf .nm{color:var(--warn,#e0a44c)}
 /* The scope row says which filter is ON in words, not in a dot: gold name = you are
    seeing everyone. Its right slot carries the agent count -- the fact worth knowing
    there, and it cannot be mistaken for a status light. */
 .agent.allrow.sel .nm{color:var(--gold);font-weight:700}
 .agent .cnt{font-size:.68rem;color:var(--faint);flex:none;
  font-variant-numeric:tabular-nums}
 .agent.allrow.sel .cnt{color:var(--gold)}
 /* The card is the only thing anchored to the bottom of the rail, so its menu opens
    upward from it -- same popup shape as the composer's recipient picker. */
 #meWrap{position:relative;margin-top:auto}
 #meMenu{display:none;position:absolute;bottom:calc(100% + .3rem);left:.6rem;right:.6rem;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.3rem;
  z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.45)}
 #meMenu.on{display:block}
 .mi{padding:.45rem .6rem;border-radius:6px;font-size:.82rem;color:var(--dim);cursor:pointer}
 .mi:hover{background:var(--hover);color:var(--fg)}
 #miLogout:hover{color:#e8555a}
 #meCard{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;
  border-top:1px solid var(--line);cursor:pointer}
 #meCard:hover{background:var(--hover)}
 #meCard .avatar{width:30px;height:30px;font-size:.72rem}
 #meCard .mename{font-size:.85rem;font-weight:700;line-height:1.2}
 /* The room line is a CONTROL, not a label. It used to render in --faint -- the same
    colour as dead metadata -- next to a gear that reads as "settings", so nothing on the
    card said "this is how you change room". */
 #meCard .meroom{font-size:.72rem;color:var(--dim);line-height:1.2;
  display:flex;align-items:center;gap:.25rem}
 #meCard:hover .meroom{color:var(--gold)}
 #meCard .chev{font-size:.6rem;opacity:.8}
 #meCard .gear{margin-left:auto;color:var(--faint);font-size:.9rem}
 #meCard:hover .gear{color:var(--fg)}
 #meDot{width:.55em;height:.55em;border-radius:50%;background:var(--faint);flex:none}
 #meDot.on{background:var(--green)}

 /* ---- main column ---- */
 #main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
 #spin{display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  background:rgba(14,17,22,.55);backdrop-filter:blur(1px);z-index:6}
 #spin.on{display:flex}
 #spin .ring{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--gold);animation:spin .8s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 #toasts{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:30;
  display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
 .toast{background:var(--card);border:1px solid #e8555a;color:var(--fg);
  border-radius:10px;padding:.55rem 1.1rem;font-size:.86rem;max-width:34rem;
  box-shadow:0 8px 30px rgba(0,0,0,.5);cursor:pointer;pointer-events:auto;
  animation:toastin .18s ease-out}
 .toast.info{border-color:var(--gold)}
 @keyframes toastin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
 #top{display:flex;align-items:center;gap:.7rem;padding:.55rem 1.1rem;
  border-bottom:1px solid var(--line);background:var(--bg)}
 #filter{flex:1;max-width:26rem;background:var(--rail);border:1px solid var(--line);
  color:var(--fg);padding:.38rem .8rem;border-radius:7px;font:inherit;font-size:.86rem}
 #filter:focus{outline:none;border-color:var(--gold)}
 #filterState{font-size:.78rem;color:var(--gold);cursor:pointer;display:none}
 #histBtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;
  padding:.34rem .9rem;cursor:pointer;font:inherit;font-size:.82rem}
 #histBtn.on,#histBtn:hover{color:var(--gold);border-color:var(--gold)}
 #voice{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;
  padding:.34rem .9rem;cursor:pointer;font:inherit;font-size:.82rem}
 #voice:hover{color:var(--gold);border-color:var(--gold)}
 /* ON is a colour AND a word ("voice on"), never colour alone -- the state has to
    survive a colourblind reader and a screen reader, which is what aria-pressed is
    for on the same element. */
 #voice.armed{color:var(--gold);border-color:var(--gold)}
 #histBar{display:none;gap:.8rem;padding:.55rem 1.1rem .7rem;
  border-bottom:1px solid var(--line);background:var(--rail);flex-wrap:wrap;
  align-items:flex-end}
 #histBar.on{display:flex}
 #histBar .hf{display:flex;flex-direction:column;gap:.2rem}
 #histBar .hf label{color:var(--faint);font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase}
 #histBar input,#histBar select{background:var(--bg);border:1px solid var(--line);
  color:var(--fg);padding:0 .6rem;border-radius:7px;font:inherit;font-size:.83rem;
  height:2.2rem}
 #histBar input:focus,#histBar select:focus{outline:none;border-color:var(--gold)}
 #histBar input{accent-color:var(--gold)}
 #histBar input::-webkit-calendar-picker-indicator{
  filter:invert(70%) sepia(60%) saturate(500%) hue-rotate(360deg);cursor:pointer}
 .qr{display:flex;gap:.35rem;align-items:center;padding-bottom:.15rem}
 .qr button{background:none;border:1px solid var(--line);color:var(--dim);
  border-radius:2em;padding:.28rem .8rem;font:inherit;font-size:.78rem;cursor:pointer}
 .qr button:hover{color:var(--gold);border-color:var(--gold)}
 .qr button.on{background:var(--gold);border-color:var(--gold);color:#14161a;font-weight:700}
 #hGo{background:var(--gold);border:0;color:#14161a;font-weight:700;
  border-radius:7px;padding:0 1.4rem;height:2.2rem;cursor:pointer;font:inherit;
  font-size:.83rem}
 #histBar .qr button{background:none;border:1px solid var(--line);color:var(--dim)}
 #histBar .qr button:hover{color:var(--gold);border-color:var(--gold)}
 #histBar .qr button.on{background:var(--gold);border-color:var(--gold);
  color:#14161a;font-weight:700}
 #histInfo{display:none;justify-content:space-between;align-items:center;
  margin:.6rem 2.2rem 0;padding:.4rem .9rem;border:1px solid var(--gold);border-radius:8px;
  color:var(--gold);font-size:.82rem}
 #histInfo.on{display:flex}
 #histInfo span b{cursor:pointer;text-decoration:underline}
 .mid{cursor:pointer}

 #feed{flex:1;overflow-y:auto;min-height:0;padding:1rem 0 1.4rem}
 #feed>.inner{max-width:none;margin:0;padding:0 2.2rem}
 .day{display:flex;align-items:center;gap:.9rem;color:var(--faint);
  font-size:.72rem;letter-spacing:.12em;margin:1.1rem 0 .8rem}
 .day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}

 .row{display:grid;grid-template-columns:42px 1fr;gap:.75rem;padding:.16rem .5rem;
  border-radius:8px}
 .row:hover{background:var(--hover)}
 .row .gutter{padding-top:.18rem}
 .avatar{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:.8rem}
 .row.cont{margin-top:-.1rem}
 .row.cont .gutter{visibility:hidden}
 .head{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap}
 .head .who{font-weight:700;font-size:.9rem}
 .head .arrow{color:var(--faint);font-size:.8rem}
 .head .toname{font-size:.8rem;font-weight:600}
 .head .all{font-size:.68rem;font-weight:700;color:var(--gold);border:1px solid var(--gold);

// The session cookie authenticates every call -- browsers attach it to fetch(), to
// <img src>, and to the WS handshake alike. The old ?token= existed ONLY because an
// <img> cannot carry a header; cookies delete that constraint, so the credential stops
// riding in URLs, referers and logs. qs() now carries the selected ROOM, never a secret.
let me=null;               // {name,is_admin,rooms,owned,public} from GET /me
let myName='';
let room=localStorage.revRoom||'';
const qsFor=r=>'?room='+encodeURIComponent(r||'');
const qs=()=>qsFor(room);
let blast=false;           // broadcast scope: false = this room only, true = every room I hold
let lastId=0,follow=true,prevMsg=null,mode='live',agentList=[];
const selAgents=new Set();     // sidebar filter: matches by FROM (default) or TO
let filterMode='from';
const recip=new Set();          // empty = ALL (broadcast); else one unicast per member
let replyTo=null;               // message id the composer is replying to
const attachments=[];           // [{name,url}] pending on the composer
// Which attachments the UI tries to show inline. This list MUST stay a subset
// of what /files/* is willing to serve inline (file_headers): an <img> pointed
// at an octet-stream download renders as a broken tile, which reads as a
// corrupt upload. SVG is served as a download on purpose -- image to a human,
// script host to a browser -- so it is not here.
const IMG_RE=/\.(png|jpe?g|gif|webp)$/i;
// AN ATTACHMENT URL IS FOREIGN INPUT, and it was the last unescaped one on this
// page -- interpolated raw into href, src and data-src through a variable named
// `safe`, which was the only thing making it look checked. send() accepts
// attachments from any bus client, the broker stores the url verbatim, and the
// result renders through innerHTML into the feed of everyone in the room, on
// the origin that also manages agents. So a message could put an onerror=
// handler or a javascript: target into the operator's browser with their
// session behind it (architect, msg 8816).
// TWO CONDITIONS, BOTH REQUIRED. It must be one of OURS -- a broker-relative
// /files/ path, which is the only shape /upload ever mints -- and it is escaped
// on the way into the attribute like every other foreign value. A scheme
// allowlist alone would not do: these are same-origin paths, so the check that
// means anything is the SHAPE, not the protocol. Anything else returns empty
// and the caller renders text, never a link.
// The server should refuse these too, and that is senior-dev's half; this one
// is the half that still holds the day the server's constraint widens.
// The accept-set is senior-dev's, mirrored exactly rather than reinvented
// (msg 8824): it is what BOTH upload paths already sanitise a stored name to,
// so anything outside it was never servable. The leading character may not be
// a dot, which refuses "." and ".." outright instead of leaning on the server
// to 404 them. Two halves agreeing by construction beats two halves agreeing
// by comment.
const FILE_URL_RE=/^\/files\/[A-Za-z0-9_-][A-Za-z0-9._-]*$/;
function attUrl(u){return FILE_URL_RE.test(u||'')?esc(u+qs()):'';}
// THE SAME ARGUMENT ONE SINK ALONG, for a URL set by PROPERTY ASSIGNMENT
// rather than built into a string (architect, msg 8823). The terminal iframe's
// src is AGBASE + attach_url, so it cannot carry a scheme at position zero --
// but that is a property of a concatenation two hundred lines away, stated
// nowhere and gated nowhere, which is the exact shape this branch keeps
// fixing. A site-relative path only: a leading double slash is protocol-
// relative and would leave the origin, and a backslash is the same trick in
// the browsers that normalise it.
const PATH_URL_RE=/^\/[^/\\]/;
function frameSrc(u){return PATH_URL_RE.test(u||'')?u:'about:blank';}

async function uploadFile(f){

}

function renderAttchips(){
 const w=$('attchips');w.innerHTML='';
 attachments.forEach((a,i)=>{
  const t=document.createElement('div');t.className='attTile';t.title=a.name;
  const tile=attUrl(a.url);
  if(tile&&IMG_RE.test(a.url)){
   t.innerHTML='<img src="'+tile+'" alt="">';
  }else{
   const ext=(a.name.includes('.')?a.name.split('.').pop():'').toUpperCase().slice(0,4)||'FILE';
   t.innerHTML='<span class="ext">'+esc(ext)+'</span><span class="fn">'+esc(a.name)+'</span>';
  }
  const rm=document.createElement('span');rm.className='rm';rm.textContent='\u2715';
  rm.title='remove '+a.name;
  rm.onclick=()=>{attachments.splice(i,1);renderAttchips();};
  t.appendChild(rm);w.appendChild(t);
 });
}

function hue(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return h%360;}
function color(n){return 'hsl('+hue(n)+' 62% 64%)';}
function tint(n){return 'hsl('+hue(n)+' 45% 26%)';}
function initials(n){const p=n.split(/[-_.]/).filter(Boolean);
 return ((p[0]?.[0]||'')+(p[1]?.[0]||p[0]?.[1]||'')).toUpperCase();}
function hhmm(ns){return new Date(ns/1e6).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function dayOf(ns){return new Date(ns/1e6).toDateString();}
// ESCAPES FOR THE POSITION IT IS ACTUALLY USED IN. The textContent round-trip
// escapes &, < and > and leaves BOTH quotes alone, which is correct for text
// and wrong for every place this page interpolates into an attribute value
// (aria-label, title, data-*, value, placeholder, alt, href). There, one
// double quote in the input closes the attribute early and everything after
// it is parsed as markup. Today no name can carry a quote -- the launcher's ROLE_RE and the
// broker's NAME_RE both forbid it -- but that is a constraint held two
// services away from the line that depends on it, and the failure is silent
// the day either one widens. Escaping here costs one pass and removes the
// question, rather than answering it once for the callers that exist now.
// Text position is unharmed: &quot; and &#39; render as the characters
// themselves when the browser parses this back as HTML.
function esc(s){const d=document.createElement('span');d.textContent=s;
 return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function matches(m){
 if(!m)return true;
 if(selAgents.size){
  // additive across selected agents; FROM = messages they posted (default),
  // TO = direct mail addressed to them (broadcasts excluded -- that is FROM's job)
  const hit=filterMode==='from'?selAgents.has(m.from):selAgents.has(m.to);
  if(!hit)return false;
 }
 const f=$('filter').value.trim().toLowerCase();
 if(!f)return true;
 const hay=(m.from+' '+m.to+' '+(m.subject||'')+' '+m.body).toLowerCase();
 return f.split(/\s+/).some(w=>hay.includes(w));
}

function attHtml(list){
 if(!list||!list.length)return '';
 return '<div class="atts">'+list.map(a=>{
  const safe=attUrl(a.url);
  const label=esc(a.name||a.url||'attachment');
  // NOT ONE OF OURS: say so in place, as text. Dropping it silently would read
  // as a message that never had an attachment, and the reader would have no
  // way to tell a refused link from an absent one.
  if(!safe)return '<span class="attlink bad" title="not a file this broker '+
   'stored -- shown as text, not as a link">'+label+'</span>';
  if(IMG_RE.test(a.url))
   return '<a href="'+safe+'" target="_blank" rel="noopener" title="open full size">'
     +'<img class="att" src="'+safe+'" alt="'+esc(a.name||'image')+'"></a>';
  const link='<a class="attlink" href="'+safe+'" download>'+label+'</a>';
  if(/\.(md|markdown)$/i.test(a.url)&&(a.bytes||0)<300000)
   return link+'<div class="mdview" data-src="'+safe+'">rendering&hellip;</div>';
  return link;
 }).join(' ')+'</div>';
}

// minimal GH-flavored subset: headers, lists, code fences, tables, quotes,
// hr, bold/italic/inline-code/links. Everything HTML-escaped first.
function mdToHtml(src){
 const inline=s=>esc(s)
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
  .replace(/(^|\W)\*([^*\s][^*]*)\*/g,'$1<i>$2</i>')
  // A LINK TARGET OUT OF A MARKDOWN ATTACHMENT IS FOREIGN TOO. The body is
  // esc()'d first, so nothing can break out of the attribute -- but escaping
  // says nothing about the scheme, and href acts on the scheme. http, https
  // and site-relative only; anything else stays on screen as the markdown
  // source it was, which shows the reader the target instead of hiding it
  // behind link text somebody else chose.
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,u)=>
   /^(https?:\/\/|\/)/i.test(u)
    ? '<a href="'+u+'" target="_blank" rel="noopener">'+txt+'</a>' : m);
 let out='',inCode=false,list=null,inTable=false;
 const closeBlocks=()=>{
  if(list){out+='</'+list+'>';list=null;}
  if(inTable){out+='</table>';inTable=false;}
 };
 for(const ln of src.split('\n')){
  if(/^\s*```/.test(ln)){closeBlocks();out+=inCode?'</code></pre>':'<pre><code>';inCode=!inCode;continue;}
  if(inCode){out+=esc(ln)+'\n';continue;}
  if(/^\s*\|.*\|\s*$/.test(ln)){
   if(list){out+='</'+list+'>';list=null;}
   if(/^\s*\|[\s:|-]+\|\s*$/.test(ln))continue;               // header separator row
   const cells=ln.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>inline(c.trim()));
   const tag=inTable?'td':'th';
   if(!inTable){out+='<table>';inTable=true;}
   out+='<tr><'+tag+'>'+cells.join('</'+tag+'><'+tag+'>')+'</'+tag+'></tr>';
   continue;
  }
  if(inTable){out+='</table>';inTable=false;}
  const h=ln.match(/^(#{1,6})\s+(.*)/);
  if(h){closeBlocks();out+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>';continue;}
  if(/^\s*[-*+]\s+/.test(ln)){
   if(list!=='ul'){closeBlocks();out+='<ul>';list='ul';}
   out+='<li>'+inline(ln.replace(/^\s*[-*+]\s+/,''))+'</li>';continue;}
  if(/^\s*\d+\.\s+/.test(ln)){
   if(list!=='ol'){closeBlocks();out+='<ol>';list='ol';}
   out+='<li>'+inline(ln.replace(/^\s*\d+\.\s+/,''))+'</li>';continue;}
  if(/^\s*>\s?/.test(ln)){closeBlocks();out+='<blockquote>'+inline(ln.replace(/^\s*>\s?/,''))+'</blockquote>';continue;}
  if(/^\s*([-_*])\s*(\1\s*){2,}$/.test(ln)){closeBlocks();out+='<hr>';continue;}
  if(!ln.trim()){closeBlocks();continue;}
  closeBlocks();out+='<p>'+inline(ln)+'</p>';
 }
 if(inCode)out+='</code></pre>';
 closeBlocks();
 return out;
}

async function hydrateMd(el){
 try{
  const r=await fetch(el.dataset.src);
  if(!r.ok){el.textContent='could not load '+el.dataset.src;return;}
  el.innerHTML=mdToHtml(await r.text());
 }catch(e){el.textContent='could not load attachment';}
 el.removeAttribute('data-src');
}

// THE ARTIFACTS BESIDE A MESSAGE (DES-013 section 7): a play icon when audio
// exists (has_audio from the listing, or the live `audio` frame) and a script
// icon when the writer left one (has_script / the `script` frame). Play is an
// explicit gesture: it works with the toggle off, stops what is sounding, and
// hands the queue back when done. The script view REPLACES the terse body in
// place and a second click restores it -- the terse text is the record.
function artIcons(m){
 return (m.has_audio?'<span class="play" data-play="'+m.id+'" title="play audio" '+
   'aria-label="play audio">&#9654;</span>':'')
  +(m.has_script?'<span class="scr" data-scr="'+m.id+'" title="view the script" '+
   'aria-label="view the script">&#9998;</span>':'');
}
function paintIcons(m){
 const row=document.querySelector('.row[data-id="'+m.id+'"] .head');
 if(!row)return;
 for(const el of row.querySelectorAll('.play,.scr'))el.remove();
 row.insertAdjacentHTML('beforeend',artIcons(m));
}
function playOne(id){

}
async function toggleScript(row,m){
 const body=row.querySelector('.body');
 if(row.classList.contains('scripted')){
  body.innerHTML=esc(m.body);row.classList.remove('scripted');return;}
 try{
  if(!m.script){const d=await api('/script/'+encodeURIComponent(m.id)+qs());m.script=d.text;}
  body.innerHTML='<span class="scrlab">SCRIPT \u00b7 generated, in character'+
   (m.script_voice?' \u00b7 '+esc(m.script_voice):'')+'</span>'+mdToHtml(m.script);
  row.classList.add('scripted');
 }catch(e){toast(e.status===404?'no script for this message':e.message);}
}
function render(m){
 const frag=document.createDocumentFragment();
 if(!prevMsg||dayOf(prevMsg.ts_ns)!==dayOf(m.ts_ns)){
  const d=document.createElement('div');d.className='day';d.textContent=dayOf(m.ts_ns);
  frag.appendChild(d);
 }
 const cont=prevMsg&&prevMsg.from===m.from&&prevMsg.to===m.to
   &&m.ts_ns-prevMsg.ts_ns<5*60*1e9&&dayOf(prevMsg.ts_ns)===dayOf(m.ts_ns);
 const row=document.createElement('div');
 row.className='row'+(m.to==='*'?' bcast':'')+(cont?' cont':'');
 row.dataset.id=m.id;
 row.title='#'+m.id+'  '+new Date(m.ts_ns/1e6).toLocaleString();
 const c=color(m.from);
 row.innerHTML=
  '<div class="gutter"><div class="avatar" style="color:'+c+';background:'+tint(m.from)+'">'
   +initials(m.from)+'</div></div>'
  +'<div class="msgcol">'
  +(cont?'':'<div class="head"><span class="who" style="color:'+c+'">'+esc(m.from)+'</span>'
    +'<span class="arrow">&rarr;</span>'
    +(m.to==='*'?'<span class="all">ALL</span>'
      :'<span class="toname" style="color:'+color(m.to)+'">'+esc(m.to)+'</span>')
    +'<time>'+hhmm(m.ts_ns)+'</time>'
    +'<span class="mid" data-thread="'+m.thread_id+'" title="view thread">#'+m.id
    +(m.thread_id!==m.id?' &middot; thread '+m.thread_id:'')+'</span>'
    +(m.from===myName?'<span class="del" data-del="'+m.id
      +'" title="retract (only while nobody has read it)">&#10007;</span>':'')
    +artIcons(m)
    +'</div>')
  +(m.subject?'<div class="subj">'+esc(m.subject)+'</div>':'')

function add(m){

// ---- DES-009 commit 3: the play queue ---------------------------------------
// Everyone in a room hears the same voices in the same ORDER. The order is the
// message id, which the log already provides -- that is the whole reason there is
// no audio stream to synchronise (DES-009 section 2).
let voiceOn=false;         // default OFF, and deliberately not persisted: see the button
const vQ=[];               // pending [{id,from}], drained in id order
let vBusy=false;           // one utterance at a time -- overlapping voices are noise
const V_MAX=8;             // queue depth past which we skip to the newest
// WANTED, as a pure decision so a gate can drive it: off means NOTHING is queued and
// therefore nothing is fetched (a toggle that still fetches is a toggle that lies),
// and nobody hears themselves -- suppressed HERE because the browser is the only
// place that knows who is watching (DES-009 section 5). The server still holds the
// file; everyone else in the room needs it.
function vWant(m,me,on){
 return !!(on&&m&&m.id&&m.from&&m.from!==me);
}
// NEXT, also pure. Sorted at take time rather than at insert, because arrival order
// is not id order and the requirement is about what PLAYS. A gap is not waited for:
// a message may legitimately have no audio, and waiting on an id that never comes is
// a stall, which section 2 forbids outright. Past V_MAX we skip to the newest and
// report how many went -- falling behind is allowed, falling behind silently is not.
function vTake(q,max){
 if(!q.length)return null;
 q.sort((a,b)=>a.id-b.id);
 if(q.length>max){const last=q[q.length-1],dropped=q.length-1;q.length=0;
  return {id:last.id,dropped:dropped};}
 return {id:q.shift().id,dropped:0};
}
let vCtx=null;
// The audible half of "visibly behind". The toast is the readable half; a tone alone
// would be a sound nobody can interpret, and a toast alone is invisible to whoever is
// listening rather than looking -- which is the entire audience of this feature.
function vMark(n){
 try{vCtx=vCtx||new (window.AudioContext||window.webkitAudioContext)();
  const o=vCtx.createOscillator(),g=vCtx.createGain();
  o.frequency.value=660;g.gain.value=0.05;o.connect(g);g.connect(vCtx.destination);
  o.start();o.stop(vCtx.currentTime+0.12);}catch(e){}
 toast(n+' message'+(n>1?'s':'')+' skipped -- audio was falling behind');
}
// ---- the player: Web Audio, bytes as they arrive (ruling 11020) ------------------
// An <audio> element will not start a stream of unknown length before ~230 KB have
// arrived (Chrome; bytes, not seconds -- measured for PR #21), so a short first chunk
// from the synthesizer bought the ear nothing there. This player fetches
// /audio/<id>.wav, decodes the s16 PCM as it lands and schedules every network chunk
// on ONE AudioContext -- vCtx, the same one vMark rings, resumed on the toggle's click
// because that click IS the autoplay gesture. Invariants carried unchanged: id order,
// one at a time, ADVANCED BY EVENTS AND NEVER BY A TIMER (the last scheduled buffer's
// onended, the fetch ending with nothing scheduled, a fetch or decode error, a 404 --
// all mean "done, next"; a backgrounded tab throttles timers to a stop, and audio is
// exactly what people background); toggle off issues no request and aborts the one in
// flight; a refusal to sound turns the toggle back off and says so; late joiners are
// not blasted (vPush is fed by the live socket only). Underrun policy: a small lead,
// and a chunk that arrives late is a GAP in the sound, never a stall of the queue.
const V_LEAD=0.15;         // seconds between "first bytes" and "first sound"
let vCtl=null;             // AbortController of the utterance in flight; .srcs = its buffers
let vLast=null;            // {id, firstAt}: when the utterance first sounded (a gate reads it)
function vCtxUp(){
 vCtx=vCtx||new (window.AudioContext||window.webkitAudioContext)();
 if(vCtx.state==='suspended')vCtx.resume();
 return vCtx;
}
// Refusal is the failure mode worth naming: without this the queue drains into
// silence and looks like a broken synthesizer. The toggle was the gesture; if the
// browser still refused, say so and turn it back off rather than pretending.
function vRefused(){
 vBusy=false;voiceOn=false;paintVoice();
 toast('your browser blocked audio -- click voice again to allow it');
}
async function vPlay(id,url){
 const ctl=vCtl=new AbortController();ctl.srcs=[];
 let ctx;
 try{ctx=vCtxUp();}catch(e){return vRefused();}
 let res;
 try{res=await fetch(url,{credentials:'same-origin',signal:ctl.signal});}
 catch(e){return vCtl===ctl?vDone():undefined;}
 if(!res.ok||!res.body)return vDone();      // 404 = a silent message (section 7)
 // resume() is async: the first utterance after the click can read "suspended" for
 // a tick. Await it once, so only a browser that still refuses is called a refusal.
 if(ctx.state!=='running'){try{await ctx.resume();}catch(e){}}
 if(ctx.state!=='running')return vRefused();
 const rd=res.body.getReader();
 let head=new Uint8Array(0),hdr=null,carry=new Uint8Array(0),next=0,pending=0,ended=false;
 const finish=()=>{if(ended&&pending===0&&vCtl===ctl)vDone();};
 try{
  for(;;){
   const {value,done}=await rd.read();
   if(done||ctl.signal.aborted)break;
   let bytes=value;
   if(!hdr){                                   // upstream's 44-byte header, then PCM
    const h=new Uint8Array(head.length+bytes.length);h.set(head);h.set(bytes,head.length);head=h;
    if(head.length<44)continue;
    const dv=new DataView(head.buffer,head.byteOffset,head.byteLength);
    hdr={ch:dv.getUint16(22,true)||1,sr:dv.getUint32(24,true),bits:dv.getUint16(34,true)};
    if(String.fromCharCode(...head.subarray(0,4))!=='RIFF'||hdr.bits!==16)throw new Error('not an s16 wav');
    bytes=head.subarray(44);
   }
   let all=bytes;
   if(carry.length){all=new Uint8Array(carry.length+bytes.length);all.set(carry);all.set(bytes,carry.length);}
   const frames=Math.floor(all.length/(2*hdr.ch));
   carry=all.slice(frames*2*hdr.ch);          // a dangling sample waits for the next chunk
   if(!frames)continue;
   const dv=new DataView(all.buffer,all.byteOffset,frames*2*hdr.ch);
   const buf=ctx.createBuffer(hdr.ch,frames,hdr.sr);
   for(let c=0;c<hdr.ch;c++){const d=buf.getChannelData(c);
    for(let i=0;i<frames;i++)d[i]=dv.getInt16((i*hdr.ch+c)*2,true)/32768;}
   const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
   const now=ctx.currentTime;
   if(next<now)next=now+V_LEAD;               // first chunk, or a late one: lead, then a gap
   if(!vLast||vLast.id!==id)vLast={id:id,firstAt:performance.now()};
   pending++;src.onended=()=>{pending--;finish();};
   ctl.srcs.push(src);src.start(next);next+=buf.duration;
  }
 }catch(e){}
 ended=true;
 finish();
}
function vStop(){
 if(!vCtl)return;
 const c=vCtl;vCtl=null;c.abort();
 for(const s of c.srcs)try{s.stop();}catch(e){}
}
// ONE place builds the audio URL (a gate counts it): the queue and the play icon.
const vUrl=id=>'/audio/'+encodeURIComponent(id)+'.wav'+qs();
function vPump(){
 if(vBusy||!voiceOn)return;
 const t=vTake(vQ,V_MAX);
 if(!t)return;
 if(t.dropped)vMark(t.dropped);
 vBusy=true;
 vPlay(t.id,vUrl(t.id));
}
function vDone(){vBusy=false;vPump();}
function vPush(m){
 if(!vWant(m,myName,voiceOn))return;
 vQ.push({id:m.id,from:m.from});
 vPump();
}
function paintVoice(){
 const b=$('voice');
 b.className=voiceOn?'armed':'';
 b.setAttribute('aria-pressed',voiceOn?'true':'false');
 b.textContent=voiceOn?'voice on':'voice off';
}
function toggleVoice(){
 voiceOn=!voiceOn;
 if(voiceOn){try{vCtxUp();}catch(e){}}      // the click is the gesture: resume here
 else{vStop();vQ.length=0;vBusy=false;}
 paintVoice();
}

async function loadPresence(){

 if(r.status===401){showLogin('session expired -- sign in again');return;}

// The room pushes presence the moment it CHANGES (0.2.38); the poll above is the
// fallback that repairs a stream which missed one. Both land here, so there is one
// renderer and no chance of the two paths drifting into different rails.
function renderPresence(agents){
 agentList=agents
  .sort((a,b)=>(b.connected-a.connected)||(b.live-a.live)||a.name.localeCompare(b.name));
 $('agents').innerHTML='';
 // "everyone" is a FILTER SCOPE, not a being: it has no presence, so it gets no presence
 // dot. It wore one because the row reused .live to mean "selected" -- the same gold dot
 // that means "live but unreachable" one row below. One channel, two meanings, so the
 // scope read as an agent having a bad day. Selection is the row highlight (what it means
 // on every other row); the count is the thing worth saying here.
 const all=document.createElement('div');
 all.className='agent allrow'+(selAgents.size?'':' sel');
 all.innerHTML='<span class="swatch" style="background:var(--gold)"></span>'
   +'<span class="nm">everyone</span>'
   +'<span class="cnt">'+agentList.length+'</span>';
 all.title=selAgents.size?'show every agent':'showing every agent';
 // Picking a filter is asking to see the transcript, which the Agents well is
 // covering right now (operator screenshot, msg 8588) -- so the same click
 // that sets the filter also returns to chat, instead of applying invisibly
 // behind the well.
 all.onclick=()=>{selAgents.clear();recip.clear();renderPicker();loadPresence();refilter();
  if($('agentsWell').classList.contains('on'))closeAgentsWell();};
 $('agents').appendChild(all);
 const sel=$('hAgent'),keep=sel.value;
 sel.innerHTML='<option value="">any</option>';
 for(const a of agentList){
  sel.innerHTML+='<option value="'+esc(a.name)+'">'+esc(a.name)+'</option>';
 }
 sel.value=keep;
 for(const a of agentList){
  const el=document.createElement('div');
  el.className='agent'+(a.live?' live':'')+(a.connected?' conn':'')
    +(a.deaf?' deaf':'')+(selAgents.has(a.name)?' sel':'');
  const web=(a.tag||'').startsWith('web:');
  // ANIMATION FOLLOWS OBSERVATION, NEVER INFERENCE (ruling 8676). Only `active`
  // moves, and `active` means one thing: a bus call from this agent landed within
  // the grace. It is not a claim about what the agent is doing inside -- the bus
  // cannot see that, and an equalizer bouncing for a crashed agent is a lie that
  // costs an afternoon. `waiting` and `unsure` are STILL, and `unsure` is faded,
  // because confidence must not outlive evidence.
  if(!web&&(a.activity==='active'||a.activity==='waiting'||a.activity==='unsure'))
   el.classList.add('act-'+a.activity);
  const eq=(!web&&a.activity==='active')
   ? '<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' : '';
  el.innerHTML='<span class="swatch" style="background:'+color(a.name)+'"></span>'
    +'<span class="nm">'+esc(a.name)+'</span>'+eq+'<span class="st"></span>';
  // Same three states, said in the vocabulary of what the row actually is: a person has
  // a tab where an agent has a waiter, and telling a human their "waiter is down" is noise
  // about a thing they were never going to run.
  el.title=a.connected?(web?'here -- watching this room live':'wake armed -- rings on unicast')
   :a.live?(web?'signed in, not watching this room':'live, waiter down -- mail queues'):'stale';
  // The activity title says what we SAW, and says it PER ROOM -- the same agent can
  // be working in another room and idle here, which is true and surprising, so it
  // gets a sentence rather than arriving later as a bug report.
  // Quiet is only worrying when nothing is LISTENING. Reachability is a separate
  // observation (the wake socket is attached or it is not), and it is the one that
  // says future mail will land -- so the two are said together rather than leaving
  // someone to combine a dot and an icon in their head. Operator, 2026-07-30: "as
  // long as the websocket to the agent is still active, we know that future comms
  // will work".
  if(!web&&a.activity&&a.activity!=='idle'){
   const reach=a.connected
    ? ' -- wake socket attached, so mail will reach it'
    : ' -- and its wake socket is NOT attached, so mail is queueing';
   el.title={active:'working -- a bus call landed just now (in THIS room; it may be '
             +'idle in others)',
             waiting:'told, no answer yet -- rung with mail unread'+reach,
             unsure:'no idea -- rung several minutes ago, still nothing heard'+reach
            }[a.activity];
  }
  // DEAF outranks the happy titles: direct mail is sitting undelivered-in-practice
  // and nothing on the agent's side has stirred since it landed. The human who
  // found every such outage by INVESTIGATING now finds it in the hover.
  if(a.deaf)el.title='DEAF ('+a.deaf_reason+'): direct mail waiting with no sign of '
   +'life since it landed -- '+(a.deaf_reason==='no-waiter'
     ?'its wake daemon is not attached; check its container/session'
     :'rings arrive but nothing acts; its session is stuck or unarmed');
  el.onclick=()=>{selAgents.has(a.name)?selAgents.delete(a.name):selAgents.add(a.name);
   recip.clear();for(const n of selAgents)if(n!==myName)recip.add(n);   // filter selection IS the target, minus yourself
   renderPicker();loadPresence();refilter();
   if($('agentsWell').classList.contains('on'))closeAgentsWell();};
  $('agents').appendChild(el);
 }
 renderPicker();
}

let ws=null;
// This page is served as one string by the daemon, so an upgraded broker leaves every open
// tab running the OLD interface until someone reloads. The daemon does not push a "reload"
// frame: a restart already drops the feed, so the reconnect IS the signal, and asking on
// the way back up also catches a tab that was asleep through the whole thing.
let bootVer=null;
async function checkVersion(){
 let v;
 try{v=await (await fetch('/version')).text();}catch(e){return;}   // offline: the next open retries
 if(!bootVer){bootVer=v;return;}
 if(v===bootVer)return;
 // Never reload out from under someone mid-sentence -- a draft is unrecoverable and this
 // is cosmetic until they act. Composer busy: tell them, let them pick the moment.
 if($('body').value.trim()||attachments.length){
  toast('v'+v+' is live -- reload when you have sent this');return;}
 location.reload();
}

function connect(){
 const proto=location.protocol==='https:'?'wss':'ws';
 ws=new WebSocket(proto+'://'+location.host+'/feed'+qs());
 ws.onopen=()=>{$('status').classList.add('on');$('meDot').classList.add('on');
  $('agents').classList.remove('stale');$('agents').title='';loadPresence();
  $('meDot').title='connected to the room feed';loadBacklog(false);checkVersion();};
 // ONE discriminator (0.2.38). This used to dispatch on which fields happened to
 // be present -- m.ping, m.error, m.deleted, else assume-a-message -- which is four
 // ad-hoc tests and no room for a fifth, and many more room-level events are coming.
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  switch(m.event){
  case 'ping':return;   // keepalive: a socket that died without a close frame must
                        // fail a WRITE, or it lingers as a phantom watcher (0.2.36)
  case 'error':
   if(m.error==='bad_token')showLogin('session expired -- sign in again');
   return;
  case 'deleted':
   for(const el of [...$('inner').children])
    if(+el.dataset.id===m.id)el.remove();
   msgs.delete(m.id);return;
  case 'presence':
   if(m.room===room)renderPresence(m.agents);
   return;
  // Speak on the AUDIO frame, not the message frame: the feed names an id the moment
  // its first synthesized byte exists (DES-009 section 2 as amended, ruling 11018).
  // The message frame lands seconds before there is anything to play, and a fetch
  // at that moment was a 404 read as silence -- the shipped client keyed on it and
  // never heard a live message unless the worker happened to be idle. LIVE arrivals
  // only: msgs holds what add() rendered live, so a late joiner is not blasted with
  // a queue of history nobody is waiting to hear (section 2).
  case 'audio':{const mm=msgs.get(m.id);if(mm){mm.has_audio=true;paintIcons(mm);vPush(mm);}return;}
  case 'script':{const mm=msgs.get(m.id);if(mm){mm.has_script=true;mm.script=m.text||mm.script;
    mm.script_voice=m.voice_id||mm.script_voice;paintIcons(mm);}return;}
  case 'message':return add(m);
  default:return;       // an event this build does not know is not an error --
  }                     // the broker may be newer, and the poll still covers us
 };
 ws.onclose=()=>{$('status').classList.remove('on');$('meDot').classList.remove('on');
  $('meDot').title='reconnecting';
  // A presence list that stopped updating looks exactly like a room where nobody
  // moved. Say which one it is: with the stream down, the rail is a LAST-KNOWN
  // reading, not a current one.
  $('agents').classList.add('stale');
  $('agents').title='live updates disconnected -- this is the last known presence';
  if(!$('login').classList.contains('on'))setTimeout(connect,2000);};
}

async function api(path,opts){
 const r=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts||{}));
 if(!r.ok){const e=await r.json().catch(()=>({}));
  // The message is for a human; the STATUS is data, and it used to be thrown
  // away whenever the body carried any text at all. Callers that wanted to
  // know "did this service answer, and how" were left inferring it from the
  // message string -- which silently fails the moment an endpoint returns
  // {"error": ...} instead of a bare status (the launcher's 401 does exactly
  // that). Carry it explicitly. Additive: every other caller reads .message.
  const err=new Error(e.detail||e.error||r.status);
  err.status=r.status;

// WHICH ROOMS an agent reaches, from the credential that grants the reach:
// GET /tokens is owner-scoped and every bound token carries its agent name and
// its room ids, so this needs no new endpoint and no guess. Presence would
// only show the agents currently talking, and a stopped agent still belongs to
// its rooms. Later tokens win: a mint SUPERSEDES the previous bound token for
// a name, and list_tokens is ordered oldest-first, so the last write is the
// live membership.
const agRoomNames={};   // room id -> name, as the tokens themselves report it
async function tokenRooms(){
 try{
  const d=await api('/tokens');const m={};
  for(const t of d.tokens||[]){
   if(!t.agent_name)continue;
   // A token's rooms arrive as {id: name} -- an object, not a list. Reading it
   // as a list put every agent in "no room" with the data sitting right there,
   // so both shapes are accepted and the NAMES it carries feed the group
   // headings: a room the reader is not a member of still gets its name.
   const r=t.rooms||{};
   const ids=Array.isArray(r)?r:Object.keys(r);
   // A token with NO rooms answers nothing, so it must not COUNT as an answer:
   // recording it put the agent in "no room" and, worse, marked the name as
   // already-answered so the /agents-seen fallback skipped it (operator's own
   // session, msg 8769: one agent grouped and twenty-two in "no room"). An
   // empty answer and no answer are the same fact here, and the code has to
   // treat them the same.
   if(!ids.length)continue;
   m[t.agent_name]=ids;
   if(!Array.isArray(r))for(const id in r)agRoomNames[id]=r[id];
  }
  return m;
 }catch(e){return {};}   // soft: an ungrouped roster still lists every agent
}
// Tokens are OWNER-SCOPED. Looking at agents you did not provision yourself
// answers with an empty list -- and every row lands in "no room" with the
// rooms sitting one call away. So what the credential cannot say, the ROOMS
// say for themselves: /agents-seen is room-scoped, readable by any member, and
// it remembers agents whose container is stopped, which presence cannot.
// Tokens still win where they exist: they are the live membership, this is the
// hive's recollection of who has been in the room.
async function seenRooms(m){
 // Snapshot the token-backed names FIRST: testing m[name] inside the loop
 // would treat the first room this fallback added as "already answered" and
 // an agent in three rooms would show under one.
 const owned=new Set(Object.keys(m));
 for(const r of (me&&me.rooms)||[]){
  try{
   const d=await api('/agents-seen?room='+encodeURIComponent(r.id));
   for(const a of d.agents||[]){
    if(owned.has(a.name))continue;
    (m[a.name]=m[a.name]||[]).push(r.id);
   }
  }catch(e){/* soft, per room: one unreadable room must not ungroup the rest */}
 }

}

async function refreshAgents(){
 $('agUnavail').hidden=true;
 let d;

  // that never got a response, and saying "not reachable" for both is what
  // sent senior-dev looking at the wrong service for a whole debugging pass
  // (msg 8589). e.status exists only when a response actually arrived, so it
  // IS the distinction -- no response, no status, genuinely unreachable.
  // This used to test the message text for digits, which looked equivalent
  // and was not: the launcher's own 401 answers {"error":"no session"}, so
  // the message is prose and the digit test called a live service dead.
  agUnavailable(e.status===401?'session expired -- reload the page':
   e.status?'the launcher returned '+e.status+' from '+AGBASE+'/agents':
   'the launcher is not reachable ('+e.message+')');
  return;}

 agAll=d.agents;

 for(const a of d.agents)agRows[a.agent]=a;
 if(!agTokRooms)agTokRooms=await seenRooms(await tokenRooms());
 drawRoster();

 // whose report cannot be read simply carries no annotation, which is honest

 for(const a of d.agents){
  if(agBoot[a.agent]||a.status==='absent')continue;

// ---- DES-008 item D: the install command, shown and never run ----------------
// THE UI MINTS AND SHOWS. IT MUST NEVER RUN. DES-008 section 4 is the security
// half of that design and is written never to soften: a native agent's reach is
// the MACHINE -- docker socket, every tenant's data root, launcher.db, the deploy
// path -- and none of that is granted by the bus. It is granted by a shell. So a
// browser button that installed one would BE a host-shell grant, and every
// tenancy boundary in DES-005 would be decoration. There is no run affordance
// here: not behind a confirm, not for an admin, not "just for the operator".
//
// The shape is senior-dev's `reveille init` (their items A-C) and it is a
// CONTRACT between their entry point and this panel, so it lives in one constant
// with a gate on it -- a drift fails on my branch rather than on the machine
// where somebody is pasting it.
// THE GIT URL, NOT A PACKAGE NAME (senior-dev, msg 8956). `--from reveille` would
// fail on the operator's machine rather than on either of our branches, which is
// the whole reason this constant is pinned by a gate.
//
// PUBLIC IS NOT PUBLISHED. The repo went public on 2026-07-31 and this line did
// not change, because visibility and resolvability are different facts: there is
// still no `reveille` on any index, so a git url remains the only form that
// resolves on a fresh machine. Anyone reading this later will be tempted to
// shorten it now that the repo is open -- that is the tidy-up the gate refuses,
// and it will keep refusing until a package name actually exists on an index, at
// which point it fails and both halves get changed deliberately.
// TWO LINES, AND THE EPHEMERAL RUNNER IS GONE (architect ruling 9078, mechanism
// found in the operator's own commands at 9061). Running the package from a
// throwaway environment puts a bin directory under ~/.cache/uv first on PATH for
// that process -- which is how a Stop hook got written pointing into the cache,
// dead at the next cache prune. senior-dev fixed the resolution in 0.2.77 so no
// caller can produce that path any more, and this still changes: the throwaway
// form worked only because `init` performed a durable install as a SIDE EFFECT,
// and a command whose durability is a side effect of another command is not a
// command to teach.
//
// The retired spelling is NOT written here, deliberately: a gate asserts its
// absence from this file, and the fleet learned that naming a forbidden token in
// the file you gate on is how the gate stops being able to tell them apart.
//
// The second line is a NAME ON PATH rather than a url, which is also what a human
// types on the re-run -- when the tool is already installed and the url is the
// part they no longer remember.
const INIT_CMD = 'uv tool install --force --from git+https://github.com/secretzer0/reveille reveille\n' +
                 'reveille init';
function installCmds(t, base){
 // The ONLY place this command is built. One site, so the gate can enumerate it
 // and so a second copy cannot drift out of agreement with the first.
 return ['export REVEILLE_URL=' + base,
         'export REVEILLE_AGENT_ROLE=' + t.agent_name,
         'export REVEILLE_TOKEN=' + t.secret,
         INIT_CMD].join('\n');
}
function installBlock(t){
 // Only a BOUND token installs an agent: the name is the identity the mint just
 // created (DES-008 ruling 8835 -- the mint IS the provisioning event). An
 // unbound token is a credential and has no agent to install.
 if(!t.agent_name)return '';
 return '<div class="pSec">INSTALL THIS AGENT ON A MACHINE WITH A SHELL</div>'+
  '<div class="pDim">Paste these on the host that will run it. This panel does '+
  'not run them and never will: installing a native agent gives it the whole '+
  'machine, and that is a grant a shell makes, not a browser. The token above is '+
  'in the third line -- it is shown once, here, and nowhere else, so copy it '+
  'before you leave this screen.</div>'+
  '<pre class="tokOut" id="installCmd">'+esc(installCmds(t, location.origin))+'</pre>'+
  // THE REPO WENT PUBLIC (operator, msg 9006), so the sentence about git
  // credentials retires with the condition that made it true. What stays is the
  // fact a reader still needs: the source is a GIT url and not an index, so the
  // machine needs git and a network path to github -- which is a different
  // failure from a package that cannot be found, and it is still the one they
  // will hit first. The credential half is gone rather than reworded, because a
  // sentence that was load-bearing yesterday is dead weight today and every line
  // here competes with the command it sits under.
  '<div class="pDim">The install line fetches from git rather than from a package '+
  'index, so the machine needs git and a route to github. It installs the tool '+
  'durably -- on a machine that already has it, the second line alone is the '+
  'whole re-run. The agent starts in whatever directory you are in, so cd there '+
  'first.</div>';
}
function wireInstallCopy(t){
 const b=$('copyInstall');
 if(!b||!t.agent_name)return;
 b.hidden=false;
 // COPY IS THE OBVIOUS ACTION because a token retyped by hand is a token typo'd
 // by hand. The clipboard write is the only thing this button does -- it sends
 // nothing anywhere, which is the property the gate pins.
 b.onclick=async()=>{
  try{await navigator.clipboard.writeText(installCmds(t, location.origin));
   toast('install command copied -- the token is in it',true);}
  catch(e){toast('could not reach the clipboard -- select the block and copy it');}
 };
}

// The rooms a NEW token will carry, chosen before the mint rather than ticked
// after it. The room being viewed sorts first and says so, because it is the one
// the reader means nine times in ten -- but nothing is pre-ticked: a credential
// that reaches a room by default is reach nobody chose.
function newRoomChips(rooms){
 const here=rooms.filter(r=>r.id===room), rest=rooms.filter(r=>r.id!==room);
 return here.concat(rest).map(r=>'<label class="chip">'+
  '<input type="checkbox" data-newroom="'+esc(r.id)+'"> '+

  (r.id===room?' <span class="pDim">(the room you are in)</span>':'')+'</label>').join('')
  ||'<div class="pDim">you hold no rooms yet -- create one first, or this token '+
    'will reach nothing</div>';
}

// ---- S6c: the memory plane (DES-001 section 14) -----------------------------
// EVERY byte of agent-authored memory text flows through memText() and nothing
// else. Facts render in the RATIFIER's privileged session, so output escaping
// is a security boundary (14.3), not a formatting choice: esc() only -- never
// mdToHtml, never raw innerHTML. Quoted blocks carry an author label above
// them, so the ratifier never has to guess which words are the system's and
// which are the draft's.
function memText(s){return esc(s==null?'':String(s));}
let memF={status:'live',kind:'',query:''};
let memOpen=null;   // uid whose provenance + decision history is expanded
function provRows(m,rooms){
 let h='';
 if(m.slug)h+='<div class="memMeta">lesson '+memText(m.slug)+' &mdash; symptom (quoted):</div>'+
  '<div class="quote">'+memText(m.symptom)+'</div>';
 // THREE states, not two. A fact whose source message was deleted still CLAIMS a
 // source, and rendering that as "no source message attached" tells the ratifier
 // the claim was never sourced -- which is the one reading that stops them asking.
 // The id is kept on screen deliberately: it is what the audit trail is searched by
 // once the message itself is gone (msg 8857).
 h+=m.source_message
  ?(m.source_message.deleted
    ?'<div class="memMeta err">source msg '+memText(m.source_message.id)+
     ' was DELETED &mdash; this fact cites evidence that is no longer in the log</div>'
    :'<div class="memMeta">source msg '+memText(m.source_message.id)+' &mdash; '+
     memText(m.source_message.sender)+' wrote (quoted):</div>'+
     '<div class="quote">'+memText(m.source_message.body)+'</div>')
  :'<div class="memMeta">no source message attached</div>';
 if(m.supersedes_tip)h+='<div class="memMeta">REPLACES text by '+
  memText(m.supersedes_tip.author)+' (quoted):</div>'+
  '<div class="quote">'+memText(m.supersedes_tip.rule||m.supersedes_tip.fact)+'</div>';
 return h;
}
async function openMemories(){
 me=await api('/me');

 const scopeName=s=>s==='global'?'global':(rooms[s]||s);
 let queue=[];try{queue=(await api('/memories/queue')).queue;}catch(e){}
 const params=new URLSearchParams();
 if(memF.query)params.set('query',memF.query);
 if(memF.kind)params.set('kind',memF.kind);
 params.set('status',memF.status);
 let res={memories:[]};
 try{res=await api('/memories?'+params);}catch(e){toast(e.message);}
 // The queue: per-item confirm ONLY. No select-all, no ratify-all -- a queue
 // that clears in one click is a rubber stamp with a progress bar (14.2).
 const qhtml=queue.map(m=>{
  if(confirming&&confirming.kind==='mrat'&&confirming.id===m.id)
   return askRow('Ratify this draft?',
    'It becomes live law, executed by every agent at boot. Per-item only; '+
    'there is no ratify-all.','');
  if(confirming&&confirming.kind==='mrej'&&confirming.id===m.id)
   return askRow('Reject this draft?',
    'A reason is REQUIRED and the author sees it. To fix wording, reject and '+
    'write your own draft citing the same source -- editing another author’s '+
    'text and approving it launders authorship.',
    '<input id="cfIn" placeholder="reason (required)" autocomplete="off">');
  return '<div class="pRow"><b>'+memText(m.author)+'</b> <span class="memMeta">'+
   memText(m.kind)+' &middot; '+memText(scopeName(m.scope))+
   (m.chain?' &middot; supersedes ('+m.chain+' deep)':'')+
   (m.fork?' &middot; <b>FORK</b>':'')+'</span>'+
   '<button data-mrat="'+memText(m.id)+'">ratify&hellip;</button>'+
   '<button class="danger" data-mrej="'+memText(m.id)+'">reject&hellip;</button>'+
   '</div><div class="quote">'+memText(m.fact)+'</div>'+provRows(m,rooms);
 }).join('')||'<div class="pDim">nothing awaiting your decision</div>';
 const list=[];
 for(const m of res.memories||[]){
  if(confirming&&confirming.kind==='mprom'&&confirming.id===m.id){
   list.push(askRow('Promote this room lesson to GLOBAL?',
    'A superseding global row authored by you goes live for EVERY agent at boot; '+
    'the room tip and any live global lesson with the same slug flip to '+
    'superseded. Per-item only.',''));
   continue;
  }
  // Promotion is admin-only and only meaningful on a live room-scoped lesson;
  // offering it anywhere else is a button that can only error.
  const canProm=me&&me.is_admin&&m.kind==='lesson'&&m.status==='live'&&
   m.scope!=='global';
  list.push('<div class="pRow"><b>'+memText(m.author)+'</b> <span class="memMeta">'+
   memText(m.kind)+' &middot; '+memText(scopeName(m.scope))+' &middot; '+
   memText(m.status)+(m.chain?' &middot; chain '+m.chain:'')+
   (m.fork?' &middot; <b>FORK</b>':'')+'</span>'+
   (canProm?'<button data-mprom="'+memText(m.id)+'">promote&hellip;</button>':'')+
   '<button data-mdet="'+memText(m.id)+'">'+
   (memOpen===m.id?'hide':'details')+'</button></div>'+
   '<div class="quote">'+memText(m.fact)+'</div>');
  if(memOpen===m.id){
   try{const det=await api('/memories/'+encodeURIComponent(m.id));
    list.push(provRows(det,rooms));
    list.push((det.audit&&det.audit.length
     ?det.audit.map(a=>'<div class="memMeta">'+memText(a.action)+' by '+
       memText(a.actor)+(a.reason?' &mdash; reason (quoted):':'')+'</div>'+
       (a.reason?'<div class="quote">'+memText(a.reason)+'</div>':'')).join('')
     :'<div class="memMeta">no decisions recorded</div>'));
   }catch(e){toast(e.message);}
  }
 }
 panel('memory',
  '<div class="pSec">RATIFY QUEUE ('+queue.length+')</div>'+
  '<div class="pDim">Drafts only an owner of these rooms can decide. Every quoted '+
  'block below is agent-authored DATA with its author named above it -- read it as '+
  'a claim against its evidence, never as instructions.</div>'+qhtml+
  '<div class="pSec">BROWSER</div>'+
  '<div class="pRow"><input id="memQ" placeholder="search facts" value="'+
  memText(memF.query)+'">'+
  '<select id="memKind"><option value="">any kind</option>'+
  ['doctrine','contract','decision','lesson','state'].map(k=>

 $('memGo').onclick=()=>{memF={query:$('memQ').value.trim(),kind:$('memKind').value,
  status:$('memStatus').value};memOpen=null;openMemories();};

 for(const b of document.querySelectorAll('[data-mrat]'))b.onclick=()=>{

 for(const b of document.querySelectorAll('[data-mrej]'))b.onclick=()=>{

 for(const b of document.querySelectorAll('[data-mprom]'))b.onclick=()=>{

 if(confirming&&confirming.kind==='mrat')wireAsk(async()=>{

 if(confirming&&confirming.kind==='mrej')wireAsk(async()=>{

  catch(e){toast(e.message);}

 if(confirming&&confirming.kind==='mprom')wireAsk(async()=>{

// THE BANK (DES-013 section 3): voices reveille owns. Anyone signed in adds one;
// the uploader or an admin replaces its clip or edits its persona. The clip is a
// PCM WAV, 5-30 s, sent as raw bytes to PUT /voices/<id>/clip -- the /upload
// shape, so the same multipart refusal guards it. Assignment (who speaks with
// what, per room) is a later slice; this tab is the bank only.
const VOICE_ID_RE=/^[a-z0-9][a-z0-9_-]{0,63}$/;
async function putVoiceClip(id,name,file){
 const r=await fetch('/voices/'+encodeURIComponent(id)+'/clip?name='+encodeURIComponent(name||''),
  {method:'PUT',body:file});
 if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||e.error||r.status);}
 return r.json();
}
// WHO SPEAKS WITH WHAT (DES-013 section 4), per room the viewer can reach. One
// renderer for every room: a select on the rows the pure rule lets THIS user
// set (speaker's owner or room owner over a default/room row), the holder's
// name on voices already taken here, plain text elsewhere. The route
// materializes defaults, so a room shows its voices before anyone speaks.
function speakerRows(rid,d){
 const taken=d.taken||{};
 return (d.speakers||[]).map(sp=>{
  const key=sp.speaker||'';
  const who='<b>'+esc(sp.name)+(sp.you?' <span class="pDim">(you)</span>':'')+
   ' <span class="pDim">'+esc(sp.kind)+(sp.present?' \u00b7 present':'')+'</span></b>';
  if(!key)return '<div class="pRow">'+who+'<span class="pDim">unbound token -- not assignable, '+
   'speaks with the digest pick</span></div>';
  const lab=sp.voice_id?esc(sp.voice_id)+' <span class="pDim">('+esc(sp.set_by||'')+')</span>'
   :'<span class="pDim">no bank voice (digest pick)</span>';
  if(!sp.editable)return '<div class="pRow">'+who+'<span>'+lab+'</span></div>';
  const opts=['<option value=""'+(sp.voice_id?'':' selected')+'>-- none (digest pick) --</option>']
   .concat(d.voices.map(v=>{
    const held=taken[v.id]&&v.id!==sp.voice_id;
    return '<option value="'+esc(v.id)+'"'+(v.id===sp.voice_id?' selected':'')+
     (held?' disabled':'')+'>'+esc(v.name)+(held?' -- held by '+esc(taken[v.id]):'')+'</option>';}));
  return '<div class="pRow">'+who+'<select data-vsel="'+esc(rid)+'" data-vspk="'+esc(key)+'">'+
   opts.join('')+'</select>'+(sp.set_by?'<span class="pDim">'+esc(sp.set_by)+'</span>':'')+'</div>';
 }).join('')||'<div class="pDim">nobody keyed here yet</div>';
}
function wireSpeakerSelects(refresh){
 for(const el of document.querySelectorAll('[data-vsel]'))el.onchange=async()=>{
  const rid=el.dataset.vsel, spk=el.dataset.vspk, v=el.value;
  const url='/rooms/'+encodeURIComponent(rid)+'/voices/'+encodeURIComponent(spk);
  try{
   if(v)await api(url,{method:'PUT',body:JSON.stringify({voice_id:v})});
   else await api(url,{method:'DELETE'});
   refresh();
  }catch(e){toast(e.message);refresh();}};
}

 wireSpeakerSelects(openVoices);
 $('newVoiceFile').onchange=()=>{const f=$('newVoiceFile').files[0];

async function openUsers(){

   // NEVER offer reset on your OWN row. A reset takes no current password, so an admin

   (isMe?'':'<button data-pw="'+u.id+'" data-name="'+esc(u.name)+'">reset password</button>')+
   '<button class="danger" data-del="'+u.id+'"'+(isMe?' data-self="1"':'')+'>delete</button>';
  return '<div class="pRow"><b>'+esc(u.name)+(isMe?' <span class="pDim">(you)</span>':'')+'</b>'+
   '<span class="pDim">'+u.role+'</span>'+ctl+'</div>';
 }).join('');
 panel('users',rows+

 $('mkUser').onclick=async()=>{

 for(const b of document.querySelectorAll('[data-role]'))b.onclick=async()=>{
  try{await api('/users/'+b.dataset.role,{method:'PATCH',
   body:JSON.stringify({role:b.dataset.to})});openUsers();}catch(e){toast(e.message);}};
 for(const b of document.querySelectorAll('[data-pw]'))b.onclick=()=>{
  confirming={kind:'reset',id:b.dataset.pw,name:b.dataset.name};openUsers();};
 if(confirming&&confirming.kind==='reset')wireAsk(async()=>{
  // A masked field, never prompt(): prompt renders a typed password in cleartext.
  const pw=$('cfIn').value, name=confirming.name, id=confirming.id;
  confirming=null;
  try{await api('/users/'+id+'/password',{method:'POST',body:JSON.stringify({password:pw})});
   toast('password reset for '+name);openUsers();}
  catch(e){toast(e.message);openUsers();}},openUsers);
 for(const b of document.querySelectorAll('[data-del]'))b.onclick=()=>{
  confirming={kind:'delUser',id:b.dataset.del,self:!!b.dataset.self};openUsers();};
 if(confirming&&confirming.kind==='delUser')wireAsk(async()=>{
  const id=confirming.id, self=confirming.self;confirming=null;
  try{await api('/users/'+id,{method:'DELETE'});
