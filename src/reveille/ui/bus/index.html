   '<div class="pRow"><input id="agCredRepo" placeholder="default repo URL" '+
    'aria-label="default repo URL"></div>'+
   '<div class="pRow"><button id="agCredSave">save credentials</button>'+
    '<span class="pDim">stored 0600 on the launcher host; values are never '+
    'echoed back</span></div>'+
   '<div id="agCredNotes" class="pDim"></div>':''));
 $('pwGo').onclick=async()=>{
  if($('pwNew').value!==$('pwNew2').value){toast('the new passwords do not match');return;}
  try{await api('/me/password',{method:'POST',
    body:JSON.stringify({old:$('pwOld').value,new:$('pwNew').value})});
   toast('password changed');openAccount();}catch(e){toast(e.message);}};
 for(const id of ['pwOld','pwNew','pwNew2'])
  $(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('pwGo').click();});
 if(typeof AGBASE!=='undefined'){refreshLoginSection();wireCredentials();}
}
// The credentials block, launcher-fed and fail-soft for the same reason the
// login section above it is: a dead launcher changes this one area's text and
// leaves the password control -- core bus UI -- working.
function wireCredentials(){
 const state=$('agCredState');
 const load=async()=>{
  try{
   const p=await lapi('/profile');
   const c=p.credentials||{};
   state.textContent='github token: '+(c.github_token||'absent');
   $('agCredRepo').value=c.repo_url||'';
   $('agCredNotes').textContent=p.notes||'';
  }catch(e){
   state.textContent=e.status?'the launcher returned '+e.status+' from '+
    AGBASE+'/profile':'the launcher is not reachable';
  }
 };
 $('agCredSave').onclick=async()=>{
  const b={repo_url:$('agCredRepo').value.trim()};
  const gh=$('agCredGithub').value.trim();if(gh)b.github_token=gh;
  try{
   await lapi('/profile',{method:'PUT',body:JSON.stringify(b)});
   $('agCredGithub').value='';   // never echoed back, so never left on screen
   toast('credentials saved',true);load();
  }catch(e){toast(e.message);}
 };
 $('agCredGithubClear').onclick=async()=>{
  try{await lapi('/profile',{method:'PUT',body:'{"github_token":""}'});load();}
  catch(e){toast(e.message);}
 };
 load();
}

// The browser login (rulings 8644): the launcher runs `claude /login` in a
// throwaway container and preselects the SUBSCRIPTION method itself -- the
// picker never reaches a human, because its other branch is per-token
// Console billing. This page only shows the URL (never follows it), relays
// the ONE pasted code, and treats the credential FILE appearing as the only
// proof of completion. Failure text names the launcher's answer (8633).
let loginPoll=null;
// paint(): re-render ONLY when the rendered content actually changed. The
// section polls while a login is pending, and a blind innerHTML= every tick
// WIPES WHAT THE HUMAN IS TYPING into the code box -- caught with the
// operator mid-flow, one keystroke from losing their code. The signature
// compare makes the poll invisible to anyone typing.
function paint(el,html){
 if(el.dataset.sig===html)return false;
 el.dataset.sig=html;el.innerHTML=html;return true;
}
async function refreshLoginSection(){
 const el=$('acctLogin');if(!el)return;
 clearTimeout(loginPoll);
 try{
  const p=await lapi('/profile');const L=p.claude_login||{};
  const cmd='<code>reveille-launch login '+esc(p.user)+'</code>';
  // ASKED IN EVERY STATE, not only when the credential is absent. Two reasons,
  // and the second is the ruling. /login/status is also the REAPER -- it removes
  // a finished login container on observation -- so a page that stops asking the
  // moment a login succeeds is a page that stops reaping exactly when there is
  // something to reap. And the cancel button below renders on st.container, which
  // there is no way to know without asking.
  const st=await lapi('/login/status').catch(()=>({}));
  // A RECOVERY CONTROL MUST NEVER BE GATED ON THE STATE IT RECOVERS FROM
  // (architect, msg 8867). Cancel used to render only while the page believed a
  // login was pending -- and the failure that stranded the operator WAS the page
  // believing wrong, so the escape hatch was hidden in the one state that needed
  // it. It now renders whenever a container exists, whatever anyone believes about
  // pending, so a misreading in either direction costs one click instead of a
  // support question. Every future improvement to the pending reading leaves that
  // intact, which is the point of hanging it on the container instead.
  const lgCancel=st.container
   ?' <button id="lgCancel">cancel the login container</button>':'';
  if(L.present){
   paint(el,'logged in ('+esc(new Date(L.logged_in_at_ns/1e6)
    .toLocaleString())+'). <button id="lgStart">re-login (switch account)</button>'+
    lgCancel+
    '<span class="pDim"> then restart your agents; or in a terminal: '+cmd+'</span>');
  }else{
   if(st.pending==='awaiting-code'&&st.url){
    // SCHEME ALLOWLIST AT THE POINT OF INTERPOLATION. esc() makes a string
    // safe to SIT in an attribute; it says nothing about what the browser
    // will DO with it, and href acts on the scheme. This URL comes from the
    // launcher relaying the login flow, so it is server-supplied today --
    // which is a property of the current parse, not a guarantee, and the
    // whole argument of this branch is that a constraint held elsewhere is
    // not a check here. Anything that is not https renders as TEXT: the
    // reader still sees the URL and can judge it, and nothing is one click
    // from a javascript: or data: target (architect, msg 8813).
    const https=/^https:\/\//i.test(st.url||'');
    paint(el,'<b>1.</b> '+(https
     ? '<a href="'+esc(st.url)+'" target="_blank" '+
       'rel="noopener noreferrer">Click here and sign in</a>'
     : '<span class="pAsk err">the login service returned a link this page '+
       'will not open: '+esc(st.url)+'</span>')+' with the account '+
     'whose plan should pay. <b>2.</b> Paste the code it shows: '+
     '<input id="lgCode" size="24" autocomplete="off"> '+
     '<button id="lgSend"'+(st.relayed?' disabled':'')+'>submit</button>'+
     lgCancel+
     (st.relayed?'<div class="pDim">code sent -- waiting for the login to '+
      'land; if nothing happens, cancel and start again</div>':''));
    loginPoll=setTimeout(refreshLoginSection,3000);
   }else if(st.pending){
    paint(el,(st.pending==='failed'
     ?'the login flow looks stuck or expired -- '
     :'starting the login flow... ')+lgCancel);
    loginPoll=setTimeout(refreshLoginSection,2000);
   }else{
    paint(el,((L.needed_by||[]).length
     ?'<b>No login on file.</b> Your agents '+esc(L.needed_by.join(', '))+
      ' cannot work until you log in. '
     :L.needed
     ?'<b>No login on file.</b> Your credential mode is home-login: you will '+
      'need this before you can create an agent. '
     :'No login on file (needed only by home-login agents). ')+
     '<button id="lgStart">log in via browser</button>'+lgCancel+
     '<span class="pDim"> or in a terminal: '+cmd+'</span>');
   }
  }
  if($('lgStart'))$('lgStart').onclick=async()=>{
   try{await lapi('/login/start',{method:'POST',body:'{}'});
    refreshLoginSection();}catch(e){toast(e.message);}};
  if($('lgSend'))$('lgSend').onclick=async()=>{
   const code=$('lgCode').value.trim();if(!code)return;
   try{await lapi('/login/code',{method:'POST',
     body:JSON.stringify({code})});
    $('lgCode').value='';toast('code sent');refreshLoginSection();}
   catch(e){toast(e.message);}};
  if($('lgCode'))$('lgCode').addEventListener('keydown',
   e=>{if(e.key==='Enter')$('lgSend').click();});
  if($('lgCancel'))$('lgCancel').onclick=async()=>{
   try{await lapi('/login/pending',{method:'DELETE'});
    refreshLoginSection();}catch(e){toast(e.message);}};
 }catch(e){
  // Named failure, never a dead modal: the password control above must
  // keep working when the launcher is down (8633's hard constraint).
  el.dataset.sig='';   // a recovered launcher must repaint, not match a stale sig
  el.textContent=e.status?'the launcher returned '+e.status+' from '+
   AGBASE+'/profile':'the launcher is not reachable';
 }
}

// The cost, stated BEFORE it is paid. A dialog that says only what it deletes
// implies the rest went too, and the rest is the half that keeps being obeyed:
// a lesson this agent wrote is read by every agent in the room at every boot.
// Retraction is a separate, per-fact act -- this names the facts so it can be made.
function pruneAsk(c,roomName){
 const f=c.foot||{counts:{authored:0,citing:0}};
 const list=(rows,none)=>(rows&&rows.length)
  ? '<ul class="pList">'+rows.map(r=>'<li>'+esc(r.kind)+
     (r.slug?' <b>'+esc(r.slug)+'</b>':'')+' &mdash; '+esc((r.fact||'').slice(0,120))+
     '</li>').join('')+'</ul>'
  : '<div class="pDim">'+none+'</div>';
 return askRow('Erase '+esc(c.id)+' from '+esc(roomName)+'?',
  'Deletes every message to or from it in this room, and the files it uploaded that '+
  'nothing else references. Replies from others are reparented to their thread root, '+
  'not deleted. A snapshot is saved first, and that is the only undo.'+
  '<div class="pSec">KEPT: '+f.counts.authored+' memories it wrote</div>'+
  list(f.authored,'nothing it authored is live here')+
  '<div class="pSec">KEPT: '+f.counts.citing+' facts distilled from its messages</div>'+
  list(f.citing,'no live fact cites its messages')+
  '<div class="pDim">These stay live and keep being served at boot. Retract them by '+
  'name in the Memory tab if any of it is wrong.</div>'+
  '<div class="pAsk">Type the agent name to confirm.</div>',
  '<input id="cfIn" placeholder="'+esc(c.id)+'" autocomplete="off">');
}
async function pruneAgent(name,rid){
 // Read the footprint FIRST and refuse to open the dialog without it: a confirm that
 // silently drops the cost when the read fails is the dialog we were trying not to build.
 let foot;
 try{foot=await api('/agents/'+encodeURIComponent(name)+'/footprint'+qsFor(rid));}
 catch(e){toast('cannot read what this would leave behind: '+e.message);return;}
 confirming={kind:'prune',id:name,room:rid,foot:foot};
 openRooms();
}

fetch('/version').then(r=>r.text()).then(v=>{bootVer=v;$('ver').textContent='v'+v;});
(async function boot(){
 let d;
 try{d=await api('/me');}
 catch(e){setupMode=false;showLogin();return;}
 if(d.setup){setupMode=true;showLogin();return;}   // zero users: bootstrap the first admin
 me=d;myName=d.name;
 // A brand-new user owns no room and no public one exists yet: that is a first-run state,
 // NOT a failed sign-in. Bouncing them to the login card said "your password is wrong" and
 // dead-ended them -- the only place to make a room is the panel behind that card. So: let
 // them in, room-less, with Rooms already open. pickRoom() starts the feed once they have one.
 if(!d.rooms.length){paintMe();openRooms();toast('create your first room to start');return;}
 if(!room||!d.rooms.some(r=>r.id===room))room=d.rooms[0].id;
 localStorage.revRoom=room;
 paintMe();updateBlast();loadBacklog(true);loadPresence();connect();start();
 // First-run directive (ruling 8633): a user whose home-login agents have NO
 // login on file is told at sign-in, ONCE per condition, by being taken to
 // the place that says the one command -- and only when it actually applies
 // (token-mode users never see it; a directive that does not apply is noise).
 // Fail-silent: a dead launcher must not touch sign-in.
 if(typeof AGBASE!=='undefined')(async()=>{
  try{
   const p=await lapi('/profile');const L=p.claude_login||{};
   if(!L.present&&L.needed){
    openAccount();
    toast('first run: your agents need a claude login -- the Account tab has the one command');
   }
  }catch(e){}
 })();
})();
</script></body></html>
