[project]
name = "reveille"
version = "0.2.288"
description = "Filesystem-woken, SQLite-brokered message bus for coordinating Claude Code sessions."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2,<3",
    "websockets>=13",
    "uvicorn>=0.30",
    "authlib==1.7.2",
    # AUTHLIB'S UNDECLARED IMPORT, and a RUNTIME one. authlib's metadata says
    # only cryptography + joserfc, but integrations/httpx_client/*.py does a
    # bare `import httpx`, and integrations/starlette_client reaches it through
    # .apps -- so merely importing the OIDC door needs httpx present. It used
    # to arrive free as mcp 1.x's transitive; mcp 2 carries httpx2 (a separate
    # package, not an alias), and nothing was left to pull it. Declared here
    # rather than in the dev group because `uv sync --frozen --no-dev` is what
    # builds the server image, and a dev-group entry is invisible to it.
    "httpx>=0.28",
]

[project.scripts]
reveille-daemon = "reveille.daemon:main"
wake = "reveille.wake:main"
reveille-waked = "reveille.waked:main"
wake-watch = "reveille.watch:main"
reveille-stop-hook = "reveille.hook:main"
reveille-install-hook = "reveille.install:main"
reveille = "reveille.cli:main"
reveille-headers = "reveille.headers:main"
reveille-upload = "reveille.upload:main"
symbol-rename = "reveille.symbol_rename:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
    "rope>=1.13",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reveille"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test owns its tmp db / ports, so the suite runs on all cores: 78 s -> 16 s.
addopts = "-n auto --dist loadgroup"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# tests use compact `setup; act` one-liners. Intentional.
"tests/*" = ["E702"]
