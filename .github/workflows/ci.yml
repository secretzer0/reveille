# PR gate (CI ruling 10877, checks 1+2): the two commands doctrine already
# names, run where nobody can forget them, plus ruling 8433 mechanised.
# HOSTED RUNNERS ONLY (10877.5): a public repo plus a self-hosted runner means
# a stranger's forked PR executes on the machine holding the live bus. A green
# run proves the gates passed -- never that a container boots or reaches the
# bus (10877.8); doctrine 9055 two-shape verification stands.
name: ci
on:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    # A healthy gate is about a minute; anything past ten is a hung runner,
    # not a slow test -- die and be re-run, never sit for half an hour.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      # THE WIRE IS WEBM/OPUS (DES-009 section 2): the worker and audition gates
      # need an ffmpeg with libopus + aac; the runner ships none. apt, measured
      # 2026-09-05 on three fresh runners (probe run 33966135786): update ~5.5s
      # + install 12-16s, libopus + native aac both present in 6.1.1 -- the
      # 2026-08-18 mirror hang did not reproduce. The version floats with the
      # runner image, accepted by ruling 14451: the encoder grep is the
      # capability gate, and the version line makes drift visible in every
      # log. The timeout bounds a mirror hang to minutes, not the 20+ it once
      # cost. Rollback if apt flakes: the sha-pinned tarball on this repo's
      # ci-ffmpeg-* release (pin eb95195a..., see 0.2.235 CHANGES).
      - timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders | grep -E 'libopus|\baac\b'
      - run: uv run pytest tests/ -q
      - run: uv run ruff check src tests scripts
      # base...head over the whole PR range: a stacked slice whose parent
      # moved the pins is green; an input change with no pin move is red.
      - run: scripts/image-pin-check "origin/${{ github.base_ref }}" HEAD
