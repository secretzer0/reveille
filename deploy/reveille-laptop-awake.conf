# /etc/systemd/logind.conf.d/reveille-laptop-awake.conf
#
# THE LAPTOP THAT RUNS AN AGENT MUST NOT SLEEP WHEN ITS LID CLOSES.
# Operator, 2026-08-18: the screen went black mid-session and Ctrl-F1 only
# sometimes brought it back; the cause was the lid flapping. A laptop is a fine
# host for a native agent, but the defaults are written for a laptop someone
# CARRIES -- suspend on lid close, blank on idle -- and an agent that is
# suspended is an agent that has gone deaf with no error anywhere. That failure
# reads exactly like the wake-path defects this week was spent closing, which is
# the strongest argument for ruling it out at the machine rather than debugging
# it again from the bus.
#
# INSTALL (operator, once, on a laptop that hosts an agent):
#   sudo install -Dm644 deploy/reveille-laptop-awake.conf \
#        /etc/systemd/logind.conf.d/reveille-laptop-awake.conf
#   sudo systemctl restart systemd-logind        # ends your GUI session: log in again
#
# NOT INSTALLED BY ANY DEPLOY, and it never should be: this changes how the
# person's own machine behaves when they shut the lid, and that is their call to
# make deliberately, not a side effect of updating a broker.

[Login]
# The lid is not a power switch on a host. Ignore it on battery too: an agent
# mid-task does not become less mid-task because the charger came out.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

# Idle does not suspend the machine. The DISPLAY may still blank -- that is the
# desktop's setting, not this file's -- and a blanked screen is harmless; a
# suspended host is not.
IdleAction=ignore
